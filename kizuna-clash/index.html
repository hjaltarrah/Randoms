<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kizuna Clash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
/* A sunny summer-festival look: sky, bunting, lanterns, straw rope. The festival is always daytime, in both colour schemes. */
:root {
  --ink: #2b2340; --paper: #fff8ec; --panel: #ffffff; --muted: #6b6380; --line: rgba(43,35,64,.14);
  --sky1: #6cc8ff; --sky2: #d8f2ff; --sand: #f7e1ad; --sand2: #efd08e;
  --red: #ff4b5c; --pink: #ff8fb8; --gold: #ffc93c; --green: #2fc27e; --blue: #2f9bff; --violet: #9b6bff;
  --fire: #ff6b3d; --water: #2f8cff; --wind: #1fae6d; --charm: #b35cff;
  --me: #2f9bff; --foe: #ff4b5c;
  --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #fff4e0; --panel: #ffffff; --sky1: #5cbcff; --sky2: #cdeeff; color-scheme: light; } }
:root[data-theme="dark"] { --paper: #fff4e0; --panel: #ffffff; --sky1: #5cbcff; --sky2: #cdeeff; color-scheme: light; }

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-weight: 700; overflow: hidden; -webkit-tap-highlight-color: transparent;
  background-image: radial-gradient(circle at 12px 12px, rgba(255,143,184,.18) 3px, transparent 3.5px); background-size: 28px 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.screen { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); }
.btn { border: 3px solid var(--ink); background: var(--panel); border-radius: 16px; padding: 12px 18px; font-weight: 900; font-size: 16px;
  box-shadow: 0 5px 0 var(--ink); transition: transform .08s, box-shadow .08s; letter-spacing: .01em; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.red { background: var(--red); color: #fff; }
.btn.blue { background: var(--blue); color: #fff; }
.btn.gold { background: var(--gold); }
.btn.green { background: var(--green); color: #fff; }
.btn:disabled { opacity: .5; transform: none; box-shadow: 0 5px 0 var(--ink); cursor: default; }
.btn.small { padding: 7px 12px; font-size: 13.5px; border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
.btn.small:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.muted { color: var(--muted); font-size: 12px; }
.panel { background: var(--panel); border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; box-shadow: 0 4px 0 var(--ink); }
.panel h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 17px; }
.panel p, .panel li { margin: 0; font-size: 14px; line-height: 1.55; font-weight: 500; }
.panel b { font-weight: 900; }
.panel ol, .panel ul { margin: 6px 0; padding-left: 20px; display: grid; gap: 5px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sheet-head h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; color: var(--red); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke; }

/* ---------- festival decoration ---------- */
.bunting { height: 26px; flex: none; background:
  conic-gradient(from 150deg at 50% 0, var(--red) 0 60deg, transparent 60deg) 0 0 / 28px 26px repeat-x; position: relative; }
.bunting::before { content: ""; position: absolute; inset: 0; background: conic-gradient(from 150deg at 50% 0, var(--gold) 0 60deg, transparent 60deg) 14px 0 / 56px 26px repeat-x; }
.bunting::after { content: ""; position: absolute; inset: 0; background: conic-gradient(from 150deg at 50% 0, var(--blue) 0 60deg, transparent 60deg) 42px 0 / 56px 26px repeat-x; }
.bunting { border-top: 3px solid var(--ink); }

/* ---------- title ---------- */
#title { justify-content: safe center; gap: 12px; text-align: center; overflow-y: auto; padding-top: 0; position: relative; }
.titleSnd { position: absolute; top: 36px; right: max(10px, env(safe-area-inset-right, 0px)); z-index: 3; }
#title .bunting { margin: 0 -10px 4px; }
.logo { margin: 0; line-height: .95; }
.logo .kanji { display: inline-grid; place-items: center; width: 74px; height: 74px; border-radius: 50%; background: var(--red); color: #fff; font-family: var(--display); font-size: 44px;
  border: 4px solid var(--ink); box-shadow: 0 5px 0 var(--ink); transform: rotate(-8deg); }
.logo .word { display: block; font-family: var(--display); font-weight: 400; font-size: 40px; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke; margin-top: 8px;
  text-shadow: 0 5px 0 var(--ink); letter-spacing: .02em; }
.logo .sub { display: inline-block; margin-top: 10px; background: var(--gold); border: 3px solid var(--ink); border-radius: 99px; padding: 3px 14px; font-size: 14px; font-weight: 900; }
.mini-tug { position: relative; height: 120px; margin: 4px auto 0; width: min(360px, 100%); border-radius: 18px; overflow: hidden; border: 3px solid var(--ink);
  background: linear-gradient(var(--sky1), var(--sky2) 62%, var(--sand) 62%); box-shadow: 0 4px 0 var(--ink); flex: none; }
.mini-tug .mt-rope { position: absolute; left: -40px; right: -40px; top: 70px; height: 10px; border: 2px solid var(--ink); border-radius: 6px;
  background: repeating-linear-gradient(60deg, #e7b75f 0 6px, #c98f2e 6px 12px); animation: mtRope 2.4s ease-in-out infinite; }
.mini-tug .mt-knot { position: absolute; left: 50%; top: 62px; width: 22px; height: 26px; margin-left: -11px; animation: mtKnot 2.4s ease-in-out infinite; }
.mini-tug .mt-l, .mini-tug .mt-r { position: absolute; top: 18px; width: 86px; height: 86px; animation: mtLeanL 2.4s ease-in-out infinite; }
.mini-tug .mt-l { left: 22px; } .mini-tug .mt-r { right: 22px; animation-name: mtLeanR; }
@keyframes mtRope { 50% { transform: translateX(-26px); } }
@keyframes mtKnot { 50% { transform: translateX(-26px); } }
@keyframes mtLeanL { 50% { transform: translateX(-10px) rotate(-8deg); } }
@keyframes mtLeanR { 50% { transform: translateX(-26px) rotate(4deg); } }
.menu { display: grid; gap: 12px; width: min(320px, 100%); margin: 6px auto 0; }
.menu2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rankwrap { width: min(320px, 100%); margin: 0 auto; }
.rank { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 3px solid var(--ink); border-radius: 16px; padding: 8px 10px; box-shadow: 0 4px 0 var(--ink); text-align: left; }
.rank .rk { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--gold); font-family: var(--display); font-size: 16px; border: 3px solid var(--ink); }
.rinfo { flex: 1; min-width: 0; display: grid; gap: 3px; }
.rinfo b { font-family: var(--display); font-weight: 400; font-size: 15px; }
.rinfo span { font-size: 11.5px; color: var(--muted); }
.rbar { height: 9px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: #fff3d6; }
.rbar i { display: block; height: 100%; background: var(--gold); }

/* ---------- setup & online ---------- */
#setup, #online, #shop, #decks, #missions { overflow-y: auto; gap: 12px; }
.setup { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding-bottom: 20px; }
.setup label { display: grid; gap: 6px; font-weight: 900; font-size: 14px; }
.setup .note { font-size: 13px; color: var(--muted); font-weight: 500; line-height: 1.45; }
.setup input { width: 100%; font: inherit; font-weight: 800; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.teampick { position: relative; border: 3px solid var(--ink); border-radius: 16px; background: var(--panel); padding: 0; overflow: hidden; text-align: left; box-shadow: 0 4px 0 var(--ink); }
.teampick svg { display: block; width: 100%; aspect-ratio: 1.25; }
.teampick .tp-txt { display: grid; padding: 6px 9px 8px; gap: 1px; }
.teampick .tp-txt b { font-family: var(--display); font-weight: 400; font-size: 14px; }
.teampick .tp-txt span { font-size: 11.5px; color: var(--muted); font-weight: 700; line-height: 1.3; }
.teampick[aria-pressed="true"] { outline: 4px solid var(--blue); outline-offset: 2px; }
.teampick[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; border: 3px solid var(--ink); font-weight: 900; }
.vsrow { display: flex; align-items: center; gap: 10px; }
.avatar { flex: none; width: 54px; height: 54px; border-radius: 50%; overflow: hidden; border: 3px solid var(--ink); background: #fff; }
.avatar svg { width: 100%; height: 100%; display: block; }
.deckline { display: flex; flex-wrap: wrap; gap: 5px; }
.dchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px 2px 3px; border-radius: 99px; border: 2px solid var(--ink); background: #fff; font-size: 12px; font-weight: 800; }
.dchip b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; background: var(--c, var(--blue)); }
.joinrow { display: flex; gap: 10px; }
.joinrow input { flex: 1; min-width: 0; width: auto !important; font: 400 24px/1 var(--display) !important; letter-spacing: .3em; text-transform: uppercase; text-align: center; padding: 8px !important; }
.joinrow .btn { flex: none; }
.onote { margin: 0; min-height: 1.4em; font-size: 13.5px; font-weight: 800; color: var(--muted); line-height: 1.45; }
.onote.bad { color: var(--red); }
.panel.warn { border-color: var(--red); }
.roomcode { text-align: center; display: grid; gap: 6px; justify-items: center; padding: 18px; }
.roomcode span { font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.roomcode b { font-family: var(--display); font-weight: 400; font-size: 56px; line-height: 1; letter-spacing: .12em; color: var(--red); -webkit-text-stroke: 2px var(--ink); paint-order: stroke; }

/* ---------- cards ---------- */
.t-fire { --c: var(--fire); } .t-water { --c: var(--water); } .t-wind { --c: var(--wind); } .t-charm { --c: var(--charm); }
.gem { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: var(--ink); font-family: var(--display); font-size: 15px; line-height: 1;
  border: 2.5px solid var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.card { width: 240px; background: #fff; border: 4px solid var(--ink); border-radius: 20px; overflow: hidden; box-shadow: 0 6px 0 var(--ink); display: flex; flex-direction: column; color: var(--ink); }
.card.legend { border-color: #c48a00; box-shadow: 0 0 0 3px var(--gold), 0 6px 0 var(--ink); }
.c-top { display: flex; align-items: center; gap: 7px; padding: 7px 8px; background: var(--c); color: #fff; border-bottom: 3px solid var(--ink); }
.c-name { flex: 1; font-family: var(--display); font-weight: 400; font-size: 18px; -webkit-text-stroke: 1px var(--ink); paint-order: stroke; }
.c-type { width: 26px; height: 26px; border-radius: 8px; background: #fff; color: var(--c); display: grid; place-items: center; border: 2px solid var(--ink); }
.c-type svg { width: 17px; height: 17px; }
.c-art { position: relative; aspect-ratio: 1; border-bottom: 3px solid var(--ink); }
.c-art svg { display: block; width: 100%; height: 100%; }
.c-leg { position: absolute; left: 8px; bottom: 8px; background: var(--gold); border: 2px solid var(--ink); border-radius: 99px; padding: 1px 9px; font-size: 11px; font-weight: 900; letter-spacing: .08em; }
.c-title { padding: 6px 10px 0; font-size: 11.5px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.c-ab { padding: 3px 10px 8px; font-size: 13.5px; line-height: 1.4; font-weight: 600; min-height: 46px; }
.c-ab b { color: var(--c); font-weight: 900; }
.c-foot { display: flex; align-items: center; gap: 6px; padding: 7px 8px; background: #fff7e6; border-top: 2px dashed var(--line); }
.st { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px 2px 6px; border-radius: 99px; border: 2px solid var(--ink); color: #fff; font-family: var(--display); font-size: 15px; }
.st svg { width: 14px; height: 14px; }
.st.pw { background: var(--red); } .st.hp { background: var(--green); }
.c-beat { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 800; color: var(--muted); }
.c-beat svg { width: 14px; height: 14px; color: var(--c); }

/* hand card */
.mini { position: relative; flex: none; width: 76px; border: 3px solid var(--ink); border-radius: 13px; overflow: hidden; background: #fff; padding: 0; text-align: left; box-shadow: 0 4px 0 var(--ink);
  transition: transform .15s, box-shadow .15s; display: block; }
.mini.legend { border-color: #c48a00; box-shadow: 0 0 0 2px var(--gold), 0 4px 0 var(--ink); }
.mini .m-art { display: block; aspect-ratio: 1; border-bottom: 2.5px solid var(--ink); }
.mini .m-art svg { display: block; width: 100%; height: 100%; }
.mini .gem { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; font-size: 13px; border-width: 2px; }
.mini .m-type { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 6px; background: var(--c); color: #fff; display: grid; place-items: center; border: 2px solid var(--ink); }
.mini .m-type svg { width: 12px; height: 12px; }
.mini .m-name { display: block; padding: 2px 5px 0; font-size: 11px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .m-st { display: flex; gap: 3px; padding: 1px 4px 4px; }
.mini .m-st i { display: inline-flex; align-items: center; gap: 2px; font-style: normal; font-size: 11px; font-weight: 900; color: #fff; border-radius: 99px; padding: 0 5px 0 3px; }
.mini .m-st svg { width: 10px; height: 10px; }
.mini .m-st .pw { background: var(--red); } .mini .m-st .hp { background: var(--green); } .mini .m-st .ch { background: var(--charm); padding: 0 6px; }
.mini.sel { transform: translateY(-12px) scale(1.04); box-shadow: 0 0 0 4px var(--blue), 0 6px 0 var(--ink); }
.mini.dim { filter: saturate(.35) brightness(.92); opacity: .75; }

/* ---------- duel ---------- */
#duel { gap: 6px; padding-top: 6px; }
.pbar { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 3px solid var(--ink); border-radius: 16px; padding: 5px 8px; box-shadow: 0 3px 0 var(--ink); position: relative; }
.pbar.active { box-shadow: 0 0 0 3px var(--gold), 0 3px 0 var(--ink); }
.pbar .avatar { width: 40px; height: 40px; border-width: 2.5px; }
.who { display: grid; line-height: 1.15; min-width: 0; flex: 1; }
.who b { font-family: var(--display); font-weight: 400; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { font-size: 11px; color: var(--muted); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small.turn { color: var(--red); }
.chips { display: flex; gap: 5px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 3px; border: 2px solid var(--ink); border-radius: 99px; padding: 1px 7px; font-size: 12px; font-weight: 900; background: #fff; }
.chip svg { width: 12px; height: 12px; }
.chip.cards { background: #ffe7f1; } .chip.trap { background: var(--charm); color: #fff; }
.iconbtn { flex: none; width: 36px; height: 36px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; display: grid; place-items: center; padding: 0; box-shadow: 0 3px 0 var(--ink); font-size: 11px; font-weight: 900; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn.armed { background: var(--red); color: #fff; width: auto; padding: 0 8px; }
.taunt { position: absolute; left: 50px; top: calc(100% + 8px); z-index: 12; max-width: 240px; background: #fff; border: 2.5px solid var(--ink); font-size: 13px; font-weight: 800; line-height: 1.35;
  padding: 6px 11px; border-radius: 14px; box-shadow: 0 3px 0 var(--ink); animation: popIn .25s ease-out; }
.taunt::before { content: ""; position: absolute; left: 14px; top: -9px; width: 12px; height: 12px; background: #fff; border-left: 2.5px solid var(--ink); border-top: 2.5px solid var(--ink); transform: rotate(45deg); }

.ribbon { display: flex; align-items: center; gap: 8px; background: #fff3c4; border: 3px solid var(--ink); border-radius: 14px; padding: 3px 8px 3px 4px; min-height: 42px; position: relative; }
.ribbon .evi { flex: none; width: 34px; height: 34px; }
.ribbon .evt { flex: 1; min-width: 0; display: grid; line-height: 1.2; }
.ribbon .evt b { font-size: 13px; font-weight: 900; } .ribbon .evt b em { font-style: normal; color: var(--muted); font-size: 11px; margin-right: 4px; }
.ribbon .evt span { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.ribbon .next { flex: none; display: flex; gap: 3px; align-items: center; font-size: 10px; font-weight: 900; color: var(--muted); }
.ribbon .next .evi { width: 24px; height: 24px; opacity: .85; }
.ribbon.flash { animation: ribbonFlash .7s ease-out; }
@keyframes ribbonFlash { 30% { transform: scale(1.05); background: var(--gold); } }

.arena { position: relative; flex: 1; min-height: 250px; border: 3px solid var(--ink); border-radius: 20px; overflow: hidden; box-shadow: 0 4px 0 var(--ink);
  background: linear-gradient(var(--sky1), var(--sky2) 46%, var(--sand) 46%, var(--sand2)); }
.arena .scene { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.meter { position: absolute; left: 8px; right: 8px; top: 8px; height: 30px; z-index: 3; }
.meter .track { position: absolute; left: 30px; right: 30px; top: 9px; height: 13px; border: 2.5px solid var(--ink); border-radius: 99px; background: #fff; overflow: hidden; }
.meter .fill { position: absolute; top: 0; bottom: 0; transition: left .6s cubic-bezier(.2,.8,.3,1.2), right .6s cubic-bezier(.2,.8,.3,1.2), background .3s; }
.meter .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 24 - 1px), rgba(43,35,64,.25) calc(100% / 24 - 1px) calc(100% / 24)); }
.meter .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 3px; margin-left: -1.5px; background: var(--ink); }
.meter .flagL, .meter .flagR { position: absolute; top: 0; width: 30px; height: 30px; display: grid; place-items: center; border: 2.5px solid var(--ink); border-radius: 10px; color: #fff; font-size: 9px; font-weight: 900; }
.meter .flagL { left: 0; background: var(--me); } .meter .flagR { right: 0; background: var(--foe); }
.meter .flagL svg, .meter .flagR svg { width: 17px; height: 17px; }
.meter .pin { position: absolute; top: 2px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; border: 2.5px solid var(--ink); background: #fff; display: grid; place-items: center;
  font-family: var(--display); font-size: 11px; transition: left .6s cubic-bezier(.2,.8,.3,1.2); z-index: 2; }
.tuglabel { position: absolute; top: 40px; left: 0; right: 0; text-align: center; z-index: 3; font-size: 12px; font-weight: 900; }
.tuglabel span { background: rgba(255,255,255,.85); border: 2px solid var(--ink); border-radius: 99px; padding: 1px 10px; }

.field { position: absolute; left: 0; right: 0; top: 58px; bottom: 6px; --ts: 60px; --tokh: calc(var(--ts) * 1.07); --rowgap: clamp(46px, 22.5%, 88px); }
@media (max-height: 780px) { .field { --ts: 52px; } }
.ropewrap { position: absolute; left: 0; right: 0; top: 50%; height: 0; z-index: 1; }
.rope { position: absolute; left: -20px; right: -20px; top: -8px; height: 16px; border: 2.5px solid var(--ink); border-radius: 8px;
  background: repeating-linear-gradient(60deg, #f2c66b 0 7px, #d79a35 7px 14px); background-position: var(--rx, 0) 0; transition: background-position .6s cubic-bezier(.2,.8,.3,1.2); }
.knot { position: absolute; top: -21px; width: 34px; height: 52px; margin-left: -17px; transition: left .6s cubic-bezier(.2,.8,.3,1.2); z-index: 2; }
.knot svg { width: 100%; height: 100%; display: block; overflow: visible; }
.team { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.tok > * { pointer-events: none; }
.tok .tk-name { position: absolute; left: 50%; bottom: -19px; transform: translateX(-50%); white-space: nowrap; font-size: 9.5px; font-weight: 900; padding: 0 5px; border-radius: 99px; background: rgba(255,255,255,.92); border: 1.5px solid var(--ink); line-height: 13px; max-width: 76px; overflow: hidden; text-overflow: ellipsis; }

.info { min-height: 36px; font-size: 13px; line-height: 1.35; display: flex; align-items: center; padding: 0 4px; font-weight: 700; }

  -webkit-text-stroke: 1px var(--ink); paint-order: stroke; }

.timer { height: 7px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: #fff; margin: 0 2px; }

/* ---------- card pop-up ---------- */

.pop .acts { display: flex; gap: 10px; }
.pop .why { background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; padding: 4px 12px; font-size: 13px; font-weight: 800; }

/* ---------- effects ---------- */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
.float { position: fixed; transform: translate(-50%, -50%); font-family: var(--display); font-size: 24px; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke; animation: floatUp .9s ease-out forwards; white-space: nowrap; }
.float.dmg { color: #fff; } .float.x2 { color: var(--gold); font-size: 17px; } .float.heal { color: #7dffb5; } .float.word { color: var(--gold); font-size: 20px; }

  -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke; padding: 8px 22px; border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); white-space: nowrap; animation: bannerIn 1s ease-out forwards; }

@keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scale(.3); } 18%, 78% { opacity: 1; transform: translate(-50%, -50%) rotate(-4deg) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60%) rotate(-4deg) scale(1); } }
.slash { position: fixed; height: 6px; border-radius: 99px; background: #fff; box-shadow: 0 0 0 2px var(--ink), 0 0 16px var(--gold); transform: translate(-50%, -50%) rotate(-30deg) scaleX(0); animation: slash .38s ease-out forwards; }

.puff { position: fixed; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid rgba(43,35,64,.3); animation: puff .6s ease-out forwards; }
@keyframes puff { to { transform: translate(var(--dx), -18px) scale(1.8); opacity: 0; } }
.confetti { position: fixed; top: -12px; width: 10px; height: 14px; border-radius: 2px; animation: fall linear forwards; z-index: 60; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
.flyoff { animation: flyoff .6s ease-in forwards !important; }
@keyframes flyoff { to { transform: translateY(-120px) rotate(200deg) scale(.4); opacity: 0; } }
.popin { animation: popIn .4s cubic-bezier(.2,1.6,.4,1); }
@keyframes popIn { from { transform: scale(.3); opacity: 0; } }

/* ---------- coach, end, sheets ---------- */
.coach { position: fixed; left: 50%; transform: translateX(-50%); z-index: 50; width: min(520px, calc(100% - 20px)); display: grid; grid-template-columns: 62px 1fr; gap: 10px;
  background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 10px; box-shadow: 0 5px 0 var(--ink); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }

.coach .crow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
.coach .step { font-size: 11px; color: var(--muted); font-weight: 900; }
.coach.nudge { animation: shake .35s; }
.hl:not(.tok) { box-shadow: 0 0 0 4px var(--gold), 0 0 0 9px rgba(255,201,60,.45) !important; border-radius: 16px; }
.btn.hl { position: relative; z-index: 45; }

  filter: drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -1px 0 var(--ink)); animation: pointDown .7s ease-in-out infinite; pointer-events: none; }

.end { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; background: rgba(43,35,64,.45); padding: 20px; }
.end .panel { width: min(360px, 100%); text-align: center; display: grid; gap: 12px; justify-items: center; padding: 20px; animation: popIn .35s cubic-bezier(.2,1.6,.4,1); }
.end .big { font-family: var(--display); font-size: 46px; line-height: 1; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke; transform: rotate(-4deg); text-shadow: 0 5px 0 var(--ink); }

.rankup { font-family: var(--display); font-size: 19px; color: var(--gold); -webkit-text-stroke: 1px var(--ink); paint-order: stroke; }

.said { font-style: italic; color: var(--muted); }
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; }

.rules { display: grid; gap: 12px; }
.trio { margin-top: 8px; line-height: 2.3; font-size: 14px; }
.tchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px 2px 6px; border-radius: 99px; color: #fff; background: var(--c); border: 2.5px solid var(--ink); font-weight: 900; font-size: 13px; }
.tchip svg { width: 14px; height: 14px; }
.evlist { list-style: none; padding: 0 !important; }
.evlist li { display: flex; gap: 8px; align-items: center; }

.ablist { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 13.5px; line-height: 1.4; font-weight: 600; }
.ablist b { font-weight: 900; color: var(--red); }
.ablist i { color: var(--muted); font-style: normal; }
.bookf { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.bookf button { display: inline-flex; align-items: center; gap: 4px; border: 2.5px solid var(--ink); background: #fff; border-radius: 99px; padding: 5px 12px; font-weight: 900; font-size: 13px; }

/* ---------- koban, menu, toast ---------- */
.koban { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
.coinpill { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 2.5px solid var(--ink); border-radius: 99px; padding: 2px 10px 2px 5px; box-shadow: 0 3px 0 var(--ink);
  font-family: var(--display); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.titleCoins { position: absolute; top: 38px; left: max(10px, env(safe-area-inset-left, 0px)); z-index: 3; }
#shopCoins, #missionsCoins { margin-left: auto; }
.btn .koban { margin-right: 3px; }
.menu2 .mbtn { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 8px; font-size: 15px; }
.mbtn .mic { width: 26px; height: 26px; flex: none; display: grid; place-items: center; }

.badge { position: absolute; top: -9px; right: -7px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; background: var(--red); color: #fff; border: 2.5px solid var(--ink);
  font-style: normal; font-size: 13px; font-weight: 900; display: grid; place-items: center; animation: tgtPulse2 1s ease-in-out infinite; }

.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 70; width: max-content; max-width: calc(100% - 24px);
  background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 14px; box-shadow: 0 4px 0 var(--ink); font-size: 14px; font-weight: 800; line-height: 1.4; animation: popIn .25s ease-out; text-align: center; }

/* ---------- rarity & locks ---------- */
.r-common { --r: #9a8fb0; } .r-rare { --r: #2f9bff; } .r-epic { --r: #9b6bff; } .r-legend { --r: #e0a800; }
.c-title { display: flex; justify-content: space-between; gap: 8px; align-items: center; }

.mini .m-lock, .c-lock { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; }

.c-lock { top: 40%; width: 54px; height: 54px; } .c-lock svg { width: 28px; height: 28px; }
.mini .m-tag { position: absolute; top: 28px; left: -2px; background: var(--red); color: #fff; font-size: 10px; font-weight: 900; padding: 0 6px; border: 2px solid var(--ink); border-radius: 0 99px 99px 0; transform: rotate(-6deg); }
.mini .m-check { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); width: 30px; height: 30px; border-radius: 50%; background: var(--green); color: #fff; border: 2.5px solid var(--ink); display: grid; place-items: center; font-size: 16px; font-weight: 900; }

.bookgrid .bk, .bookgrid > .mini { content-visibility: auto; contain-intrinsic-size: 78px 128px; }
.bookcount { display: grid; gap: 6px; margin: 0 0 12px; font-size: 14px; font-weight: 800; }

/* ---------- Lucky Bags ---------- */
.bags { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bagtile { display: grid; grid-template-rows: auto 1fr auto; gap: 4px; background: var(--panel); border: 3px solid var(--ink); border-radius: 16px; padding: 8px; box-shadow: 0 4px 0 var(--ink); text-align: center; }

.bagtxt b { font-family: var(--display); font-weight: 400; font-size: 14px; }

.stallrow { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.stallitem { display: grid; gap: 8px; justify-items: center; }
.stallitem .btn { display: inline-flex; align-items: center; }

/* ---------- bag opening ---------- */
.bagopen { position: fixed; inset: 0; z-index: 36; display: grid; place-items: center; padding: 16px; overflow-y: auto;
  background: radial-gradient(circle at 50% 42%, #fff6cf 0, #ffd36b 30%, #ff8f5a 70%, #d9475c 100%); }
.bo-in { display: grid; justify-items: center; gap: 14px; width: min(420px, 100%); text-align: center; }
.bo-in h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke; text-shadow: 0 4px 0 var(--ink); }
.bo-bag { width: 210px; height: 210px; border: 0; background: none; padding: 0; animation: bob 1.6s ease-in-out infinite; }
.bo-bag svg { width: 100%; height: 100%; display: block; }
.bo-bag.shake { animation: bagShake .3s ease-in-out; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-2deg); } }
@keyframes bagShake { 20% { transform: rotate(-10deg) scale(1.05); } 40% { transform: rotate(9deg) scale(1.08); } 60% { transform: rotate(-6deg) scale(1.1); } 80% { transform: rotate(4deg); } }
.bo-hint { margin: 0; font-weight: 900; font-size: 15px; }
.bo-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; }
.bo-card { position: relative; border: 0; background: none; padding: 0; display: grid; justify-items: center; gap: 4px; animation: dealIn .45s cubic-bezier(.2,1.4,.4,1) backwards; }
.bo-card:nth-child(2) { animation-delay: .08s; } .bo-card:nth-child(3) { animation-delay: .16s; }
@keyframes dealIn { from { transform: translateY(80px) scale(.4) rotate(-20deg); opacity: 0; } }
