<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Howl</title>
<meta name="description" content="A one-night hidden-role game. Host a room, friends join with the code from their phones.">
<meta name="theme-color" content="#141938">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23141938'/%3E%3Ccircle cx='30' cy='30' r='17' fill='%23f3ead2'/%3E%3Ccircle cx='37' cy='25' r='15' fill='%23141938'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/grenze-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/alegreya-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Grenze Gotisch";font-weight:800;font-display:swap;src:url(fonts/grenze-800.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-weight:400;font-display:swap;src:url(fonts/alegreya-400.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-weight:500;font-display:swap;src:url(fonts/alegreya-500.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-weight:700;font-display:swap;src:url(fonts/alegreya-700.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-weight:800;font-display:swap;src:url(fonts/alegreya-800.woff2) format("woff2")}
/* Phone-first single column (max 520px). A fixed sky sits behind everything and changes with the story:
   night → dawn (day talk) → blood (werewolves win) or gold (village wins). Cards are bone-coloured objects;
   everything else is ink-blue panels on the sky. */
:root{
  --night:#141938; --panel:#1d2350; --panel-2:#262e66; --line:#353f82;
  --bone:#f3ead2; --text:#ece6d6; --muted:#aeb0cc; --dim:#7f84ad;
  --lantern:#f4a93c; --lantern-ink:#2a1a04;
  --blood:#e04a62; --sage:#5cc39e;
  --f-display:"Grenze Gotisch","Iowan Old Style",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r-card:14px; --r-ctl:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--night)}
body{margin:0;min-height:100svh;color:var(--text);font:17px/1.5 var(--f-body);font-variant-numeric:lining-nums;background:var(--night);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}

/* ---------- sky ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.sky .l-night{background:radial-gradient(120% 70% at 70% -10%,#36408f 0%,#1d2453 45%,#141938 80%)}
.sky .l-dawn{background:linear-gradient(180deg,#2d3d78 0%,#5b5f9e 38%,#c9846c 78%,#efb977 100%)}
.sky .l-wolf{background:radial-gradient(110% 70% at 50% -5%,#7a1f33 0%,#3b1027 50%,#170a1c 90%)}
.sky .l-village{background:linear-gradient(180deg,#45679f 0%,#86a1c4 40%,#f1cf8e 85%,#f6dfa4 100%)}
body[data-sky=night] .l-night,body[data-sky=dawn] .l-dawn,body[data-sky=wolf] .l-wolf,body[data-sky=village] .l-village,body[data-sky=none] .l-night{opacity:1}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 33% 9%,#fff7 50%,transparent 51%),radial-gradient(1.4px 1.4px at 58% 26%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 82% 14%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 91% 37%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 7% 44%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 46% 41%,#fff4 50%,transparent 51%);transition:opacity 1.6s}
body[data-sky=dawn] .stars,body[data-sky=village] .stars{opacity:0}
.moon{position:absolute;right:-30px;top:-40px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fbf3dc 0%,#efe2bd 60%,#d9c799 100%);box-shadow:0 0 80px 20px #f3ead226;transition:transform 1.8s ease,opacity 1.6s}
body[data-room] .moon{width:130px;height:130px;right:-46px;top:-74px}
body[data-sky=dawn] .moon,body[data-sky=village] .moon{transform:translate(60px,-80px);opacity:.25}
body[data-sky=wolf] .moon{background:radial-gradient(circle at 40% 40%,#ffd1c4 0%,#e5806f 60%,#a8394a 100%);box-shadow:0 0 90px 24px #e04a6233}
.ridge{position:absolute;left:0;right:0;bottom:0;height:90px;background:#0d1028;clip-path:polygon(0 60%,12% 45%,22% 55%,35% 30%,46% 50%,58% 38%,70% 58%,82% 40%,100% 52%,100% 100%,0 100%);opacity:.85;transition:background 1.6s}
body[data-sky=dawn] .ridge{background:#3a2a3e}
body[data-sky=village] .ridge{background:#6b5a4a}

/* ---------- frame ---------- */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.bar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;margin:0 -16px;position:sticky;top:0;z-index:5;background:rgba(12,15,38,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
main{padding-top:6px}
.brand{font:800 1.6rem/1 var(--f-display);color:var(--bone);margin-right:auto;letter-spacing:.01em}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#0e1230aa;border:1px solid var(--line);backdrop-filter:blur(6px)}
.iconbtn[aria-pressed=true]{background:var(--lantern);color:var(--lantern-ink);border-color:var(--lantern)}
.codechip{height:42px;padding:0 14px;border-radius:999px;background:#0e1230aa;border:1px solid var(--line);font-weight:700;letter-spacing:.12em;backdrop-filter:blur(6px)}
.banner{margin:4px 0 8px;padding:9px 13px;border-radius:var(--r-ctl);background:#3b1a24e6;border:1px solid #e04a6266;font-size:.95rem}
main{flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:20px}
.foot{position:sticky;bottom:0;z-index:4;margin:0 -16px;padding:30px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:8px;background:linear-gradient(180deg,rgba(12,15,38,0) 0,rgba(12,15,38,.94) 26px)}
.foot .note{margin:0;text-align:center;color:var(--muted);font-size:.95rem}

h1,h2,h3{margin:0;font-weight:800}
h2{font:800 1.9rem/1.1 var(--f-display);color:var(--bone)}
h3{font:700 1.05rem/1.3 var(--f-body);color:var(--bone)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.92rem}
.panel{background:#1d2350e0;border:1px solid var(--line);border-radius:var(--r-card);padding:14px;display:grid;gap:10px;min-width:0}
.panel>*{min-width:0}

/* ---------- controls ---------- */
.btn{min-height:52px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--panel-2);font-weight:700;font-size:1.05rem;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--lantern);border-color:var(--lantern);color:var(--lantern-ink)}
.btn.danger{background:#5a1d2b;border-color:#e04a6280}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;font-size:.95rem;padding:0 12px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > .btn{flex:1}
label.field{display:grid;gap:6px;font-weight:700;color:var(--bone)}
.input{width:100%;min-width:0;min-height:52px;border-radius:var(--r-ctl);border:1px solid var(--line);background:#0e1230;padding:0 14px;font-size:1.1rem}
.input:focus{border-color:var(--lantern);outline:none}
.codein{letter-spacing:.4em;text-transform:uppercase;font-weight:800;font-size:1.6rem;text-align:center}
.err{color:#ff9aa9;font-weight:600}
.seg{display:flex;background:#0e1230;border:1px solid var(--line);border-radius:var(--r-ctl);padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- home ---------- */
.home{justify-content:flex-end;gap:16px;padding-top:24px}
.title{font:800 clamp(5.5rem,30vw,8.5rem)/.8 var(--f-display);color:var(--bone);letter-spacing:-.01em;text-shadow:0 6px 40px #0008}
.tagline{font-size:1.15rem;color:var(--muted);max-width:22em}
.home .panel{padding:16px;gap:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:.9rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
details.rules{background:#1d2350c0;border:1px solid var(--line);border-radius:var(--r-card);padding:0 14px}
details.rules summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details.rules ol{margin:0 0 14px;padding-left:20px;display:grid;gap:6px;color:var(--muted)}

/* ---------- players ---------- */
.who{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--bone);white-space:nowrap}
.who i{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none}
.players{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.players li{display:flex;align-items:center;gap:9px;min-height:50px;padding:6px 8px 6px 10px;border-radius:var(--r-ctl);background:#141938cc;border:1px solid var(--line);min-width:0}
.players .av{width:30px;height:30px;border-radius:50%;background:var(--pc);color:#141938;display:grid;place-items:center;font-weight:800;flex:none}
.players .nm{min-width:0;flex:1;line-height:1.15}
.players .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players .nm small{color:var(--muted);font-size:.8rem}
.players li.off{opacity:.55}
.players li.mark{border-color:var(--sage)}
.players .kick{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);flex:none}
.tick{color:var(--sage);font-weight:800}

/* ---------- lobby ---------- */
.codebox{display:grid;gap:10px;text-align:center;padding:18px 14px}
.codebox .code{font:800 4.4rem/1 var(--f-body);letter-spacing:.18em;color:var(--bone);margin-right:-.18em}
.advice{border-radius:var(--r-ctl);padding:12px;background:#0e1230;border:1px solid var(--line);display:grid;gap:8px}
.advice.light,.advice.heavy{border-color:#f4a93c88}
.advice .status{font-weight:700}
.advice.ok .status{color:var(--sage)}
.advice.light .status,.advice.heavy .status{color:var(--lantern)}
.meter{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.meter b{font:800 1.5rem/1 var(--f-body);color:var(--bone)}
.meter .bad b{color:var(--lantern)}
.bar-track{height:8px;border-radius:99px;background:#0e1230;overflow:hidden;border:1px solid var(--line)}
.bar-track span{display:block;height:100%;background:var(--sage);border-radius:99px;transition:width .3s}
.bar-track.over span{background:var(--blood)}
.deck{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.deck li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 8px 8px 6px;border-radius:var(--r-ctl);background:#141938b0;border:1px solid transparent}
.deck li.in{background:#262e66;border-color:var(--line)}
.deck li .ic{width:44px;height:44px;border-radius:10px;background:var(--bone);display:grid;place-items:center}
.deck li .tx{min-width:0}
.deck li .tx b{display:block;color:var(--bone)}
.deck li .tx small{display:block;color:var(--muted);font-size:.82rem;line-height:1.3}
.deck li.wolf .tx b{color:#ff9aa9}
.deck li.wolf .ic{box-shadow:inset 0 0 0 2px var(--blood)}
.step{display:flex;align-items:center;gap:2px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#0e1230;font-size:1.3rem;font-weight:800;line-height:1}
.step button:disabled{opacity:.3}
.step output{min-width:24px;text-align:center;font-weight:800;font-size:1.15rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rc{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 3px;border-radius:999px;background:#0e1230;border:1px solid color-mix(in srgb,var(--rc) 55%,transparent);font-weight:700;color:var(--bone);white-space:nowrap;vertical-align:middle;line-height:1.5}
.rc svg{flex:none;background:var(--bone);border-radius:50%;padding:2px}
.rc .n{color:var(--muted);font-weight:800}
.line{line-height:1.7}
.line .rc,.line .who{margin:0 1px}

/* ---------- card ---------- */
.cardwrap{display:grid;place-items:center;padding:6px 0}
.card3d{width:min(64vw,240px);aspect-ratio:5/7.4;border:0;padding:0;background:none;perspective:1200px}
.card3d .in{display:block;position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.card3d.up .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 40px #0009}
.face.back{background:#232a5e;display:grid;place-items:center;border:2px solid #3b4592}
.face.back svg{width:100%;height:100%}
.face.front{transform:rotateY(180deg);background:var(--bone);color:#1c1a24;display:grid;grid-template-rows:auto 1fr auto auto;justify-items:center;padding:16px 14px 14px;gap:6px;border:6px solid var(--rc)}
.face.front .team{font-weight:800;font-size:.8rem;color:var(--rc);letter-spacing:.06em}
.face.front .art{display:grid;place-items:center}
.face.front .nm{font:800 2.2rem/1 var(--f-display);color:#1c1a24}
.face.front .bl{font-size:.92rem;line-height:1.35;text-align:center;color:#3c3846}
.minicard{width:74px;aspect-ratio:5/7.4;border-radius:10px;background:var(--bone);border:4px solid var(--rc);display:grid;justify-items:center;align-content:center;gap:2px;color:#1c1a24;padding:4px}
.minicard b{font:800 .9rem/1 var(--f-display);text-align:center}
.minicard.back{background:#232a5e;border-color:#3b4592;color:var(--bone)}
.minicard.back svg{width:100%;height:100%}

/* ---------- night ---------- */
.order{list-style:none;margin:0;padding:0;display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.order li{width:32px;height:32px;border-radius:50%;background:var(--bone);display:grid;place-items:center;opacity:.35;border:2px solid transparent;transition:opacity .4s,transform .4s}
.order li.done{opacity:.18}
.order li.now{opacity:1;transform:scale(1.18);border-color:var(--lantern);box-shadow:0 0 18px #f4a93c88}
.stage{text-align:center;display:grid;gap:10px;justify-items:center;padding:8px 0}
.stage h2{font-size:2.3rem}
.timebar{width:100%;max-width:340px;height:6px;border-radius:99px;background:#0e1230;overflow:hidden}
.timebar span{display:block;height:100%;background:var(--bone);transform-origin:left;border-radius:99px}
.sleep{font:800 1.4rem var(--f-display);color:var(--dim);text-align:center;padding:12px 0}
.act{border:2px solid var(--lantern);box-shadow:0 0 0 6px #f4a93c1f}
.act .prompt{font-weight:700;font-size:1.1rem;color:var(--bone)}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick button{min-height:54px;border-radius:var(--r-ctl);border:1px solid var(--line);background:#141938;display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:700;text-align:left;min-width:0}
.pick button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick button i{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none}
.pick button[aria-pressed=true]{background:var(--lantern);color:var(--lantern-ink);border-color:var(--lantern)}
.centers{display:flex;justify-content:center;gap:12px}
.centers button{border:0;background:none;padding:0;display:grid;gap:6px;justify-items:center;color:var(--muted);font-weight:700}
.centers button .minicard{transition:transform .2s;width:80px}
.centers button[aria-pressed=true] .minicard{transform:translateY(-8px);box-shadow:0 0 0 3px var(--lantern),0 10px 20px #0008}
.centers button[aria-pressed=true]{color:var(--lantern)}
.learned{display:grid;gap:8px}
.learned .line{padding:9px 11px;border-radius:10px;background:#141938cc;border:1px solid var(--line)}
.learned .line.fresh{border-color:var(--lantern);background:#2a2440}

/* ---------- day / vote ---------- */
.clock{text-align:center;display:grid;gap:4px;padding:6px 0}
.clock .big{font:800 4.6rem/1 var(--f-body);color:var(--bone);font-variant-numeric:tabular-nums;text-shadow:0 4px 30px #0007}
.clock .big.low{color:var(--lantern)}

/* ---------- reveal ---------- */
.verdict{font:800 clamp(2.8rem,13vw,4rem)/.95 var(--f-display);color:var(--bone);text-align:center;text-shadow:0 6px 40px #000a}
.end .why{text-align:center;color:var(--text);font-size:1.1rem}
.you{justify-self:center;padding:6px 16px;border-radius:999px;font-weight:800;font-size:1.05rem}
.you.win{background:var(--sage);color:#0b2a1f}
.you.lose{background:#2c1420;color:#ffb3c0;border:1px solid #e04a6280}
.dead{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.dead figure{margin:0;display:grid;gap:6px;justify-items:center}
.dead figcaption{font-weight:700}
.table{display:grid;gap:6px}
.table .tr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:#141938cc;border:1px solid var(--line)}
.table .tr.died{border-color:#e04a6299}
.table .tr .w{font-weight:800;font-size:.85rem;padding:1px 8px;border-radius:999px}
.table .tr .w.y{background:var(--sage);color:#0b2a1f}
.table .tr .w.n{background:#2c1420;color:#ffb3c0}
.table .cards{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.arrow{color:var(--dim)}
.story{margin:0;padding-left:22px;display:grid;gap:8px}
.story li::marker{color:var(--dim);font-weight:700}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:20;display:grid;align-items:end;background:#05061299}
.sheet .box{max-width:520px;width:100%;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;max-height:88svh;overflow:auto}
.sheet ol{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}
.sheet .order{justify-content:flex-start}

@media (prefers-reduced-motion:reduce){
  .card3d .in,.sky i,.moon,.order li,.centers button .minicard{transition:none}
}
@media (min-width:600px){ .pick{grid-template-columns:repeat(3,minmax(0,1fr))} }
</style>
</head>
<body data-sky="night">
<div class="sky" aria-hidden="true"><i class="l-night"></i><i class="l-dawn"></i><i class="l-wolf"></i><i class="l-village"></i><div class="stars"></div><div class="moon"></div><div class="ridge"></div></div>
<div id="app"><main class="home"><p class="tagline">Loading…</p></main></div>
<script src="mqtt.min.js"></script>
<script src="logic.js"></script>
<script src="art.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</body>
</html>
