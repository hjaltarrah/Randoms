      if (vis){
        ring.classList.remove('none');
        ring.style.left = (r.left - 6) + 'px'; ring.style.top = (r.top - 6) + 'px'; ring.style.width = (r.width + 12) + 'px'; ring.style.height = (r.height + 12) + 'px';
        ring.style.boxShadow = s.dim === false ? '0 0 18px #ffd43b' : '';
        hand.style.opacity = s.dim === false ? 0 : 1; hand.style.left = (r.left + r.width / 2) + 'px'; hand.style.top = (r.top + r.height / 2) + 'px';
        const low = r.top + r.height / 2 > innerHeight * 0.55;
        box.classList.toggle('top', low); box.classList.toggle('bottom', !low);
        box.style.top = s.pos === 'mid' ? '36%' : ''; if (s.pos === 'mid') box.classList.remove('top', 'bottom');
      } else {
        ring.classList.add('none'); hand.style.opacity = 0;
        box.style.top = '';
        const up = ov || BT;
        box.classList.toggle('top', !!up); box.classList.toggle('bottom', !up);
      }
      const p = $('#tut .tut-bub p');
      if (p){
        const want = (!vis && s.tab && s.tab !== UI.tab && !BT && !s.ok) ? s.text + ` <br><span class="lbl">Open the <b>${TAB_N[s.tab]}</b> tab first.</span>` : s.text;
        if (p.innerHTML !== want) p.innerHTML = want;
      }
    }
    return {hit, update, hide, active, is: id => { const s = cur(); return !!s && s.id === id; }, start: () => { G.tut = 1; save(); update(); }, finish};
  })();

  /* ---------- actions ---------- */
  const ACT = {
    close: () => closeOverlay(),
    tab: d => { UI.tab = d.t; render(); if (d.t === 'arena') Online.processDefense(); },
    bld: d => {
      const t = d.t;
      if (t === 'arena' && !arenaOpen()) return toast('Defeat the Bamboo Grove boss to open the Dojo Arena');
      if (t === 'summon' || t === 'box' || t === 'arena' || t === 'map'){ UI.tab = t; render(); if (t === 'arena') Online.processDefense(); }
      else if (t === 'quests') openQuests();
      else if (t === 'shop') openShop();
      else if (t === 'mine-gold') openMine('gold');
      else if (t === 'mine-pearl') openMine('pearl');
    },
    collect: d => {
      const k = d.k, amt = mineAmt(k);
      if (amt <= 0) return;
      give(k === 'gold' ? {gold: amt} : {pearls: amt});
      G.mines[k].t = Date.now();
      G.collects = (G.collects || 0) + 1;
      track('collect');
      save(); renderTop(); toast(`+${fmt(amt)} ${MINE[k].unit}`); openMine(k);
    },
    upmine: d => {
      const k = d.k, m = G.mines[k], cost = MINE[k].cost[m.lv - 1];
      if (m.lv >= 5 || G.gold < cost) return;
      const amt = mineAmt(k); give(k === 'gold' ? {gold: amt} : {pearls: amt}); m.t = Date.now();
      G.gold -= cost; m.lv++;
      save(); renderTop(); toast(`${MINE[k].name} is now Lv ${m.lv}`); openMine(k);
    },
    qclaim: d => {
      const q = QUESTS.find(x => x.k === d.k); dailyReset();
      if (!q || G.daily.got[q.k] || (G.daily.c[q.k] || 0) < q.goal) return;
      G.daily.got[q.k] = 1; give(q.r); save(); renderTop(); renderTabs(); openQuests();
    },
    qall: () => {
      if (G.daily.all || !QUESTS.every(q => G.daily.got[q.k])) return;
      G.daily.all = true; give({s: 1}); save(); renderTabs(); toast('Silver Ofuda earned!'); openQuests();
    },
    buy: d => {
      const it = SHOP.find(x => x.id === d.id); if (!it) return;
      if ((it.cost.gold || 0) > G.gold || (it.cost.pearls || 0) > G.pearls) return toast('Not enough to buy that');
      G.gold -= it.cost.gold || 0; G.pearls -= it.cost.pearls || 0; give(it.give);
      save(); renderTop(); toast('Bought ' + it.n); openShop();
    },
    isle: d => openRegion(+d.r),
    stage: d => openStage(+d.r, +d.s),
    fight: d => { const r = +d.r, s = +d.s; playScene('pre-' + r + '-' + s).then(() => startBattle('stage', {r, s})); },
    editTeam: () => openPicker('team'),
    editDef: () => openPicker('def'),
    pk: d => {
      const id = +d.id, p = UI.pick, i = p.ids.indexOf(id);
      if (i >= 0) p.ids.splice(i, 1);
      else if (p.ids.length < 4) p.ids.push(id);
      else return toast('A team holds four monsters');
      const sc = $('.sheet') ? $('.sheet').scrollTop : 0;
      drawPicker(); if ($('.sheet')) $('.sheet').scrollTop = sc;
    },
    pkSave: () => {
      G[UI.pick.kind] = UI.pick.ids.slice();
      save(); closeOverlay(); refreshView();
      if (UI.pick.kind === 'def') Online.pushArena();
      toast('Team saved');
    },
    mon: d => openMon(+d.id),
    none: () => {},
    sort: d => { UI.sort = d.v; refreshView(); },
    elf: d => { UI.elf = d.v; refreshView(); },
    dex: () => openDex(),
    train: d => {
      const m = mon(+d.id); if (!m) return;
      const cost = Math.ceil((xpNeed(m.lv) - m.xp) * 1.4);
      if (G.gold < cost || m.lv >= maxLevel(m.st)) return;
      G.gold -= cost; giveXp(m, xpNeed(m.lv) - m.xp); track('power');
      save(); renderTop(); openMon(m.id);
      const sc = $('.sheet'); if (sc) sc.scrollTop = sc.scrollHeight;
    },
    feed: d => openFodder('feed', +d.id),
    evo: d => {
      const m = mon(+d.id); if (!m) return;
      if (m.lv < maxLevel(m.st)) return toast(`Reach level ${maxLevel(m.st)} first`);
      openFodder('evo', +d.id);
    },
    fod: d => {
      const f = UI.fod, id = +d.id, i = f.ids.indexOf(id), max = f.mode === 'evo' ? mon(f.id).st : 5;
      if (i >= 0) f.ids.splice(i, 1);
      else if (f.ids.length < max) f.ids.push(id);
      else return toast(`Limit is ${max}`);
      const sc = $('.sheet') ? $('.sheet').scrollTop : 0;
      drawFodder(); if ($('.sheet')) $('.sheet').scrollTop = sc;
    },
    fodGo: () => applyFodder(),
    lock: d => { const m = mon(+d.id); m.lock = !m.lock; save(); openMon(m.id); refreshView(); },
    release: d => {
      const m = mon(+d.id); if (!m || m.lock || inUse(m.id)) return;
      confirmBox(`Release ${monName(m.f, m.el)}?`, `Release +${fmt(releaseGold(m))}`, () => {
        G.gold += releaseGold(m); G.mons = G.mons.filter(x => x.id !== m.id); save(); refreshView(); toast('Monster released');
      });
    },
    sum: d => doSummon(d.k, d.n),
    rates: () => openRates(),
    attack: d => { const opp = opponents().find(p => String(p.id) === d.id); if (opp) startBattle('arena', {opp}); },
    bauto: () => {
      UI.auto = !UI.auto;
      const b = $('#bAuto'); if (b) b.classList.toggle('on', UI.auto);
      if (UI.auto && BT && BT.wait){ const c = BT.b.aiChoose(BT.wait.u); resolvePlayer(c.si, c.tg); }
    },
    bspeed: () => { UI.speed = UI.speed === 1 ? 2 : UI.speed === 2 ? 3 : 1; const b = $('#bSpd'); if (b) b.textContent = '×' + UI.speed; },
    bskill: d => {
      const w = BT && BT.wait; if (!w) return;
      const i = +d.i; if (!BT.b.ready(w.u, i)) return;
      const s = w.u.skills[i];
      if (w.si === i){ resolvePlayer(i, s.t === 'e' ? BT.b.pickTarget(w.u).key : null); return; }
      w.si = i; drawSkills();
    },
    btgt: d => {
      const w = BT && BT.wait; if (!w) return;
      const s = w.u.skills[w.si], t = BT.b.byKey(d.key);
      if (s.t === 'e'){ if (t && t.alive && t.side !== w.u.side) resolvePlayer(w.si, t.key); }
      else resolvePlayer(w.si, null);
    },
    bexit: () => {
      if (BT && BT.b.over) return endBattle();
      dialog(`<div class="h2">Retreat from battle?</div><div class="lbl">You won't get any rewards.</div><div class="row"><button class="btn red" style="flex:1" data-act="bquit">Retreat</button><button class="btn ghost" style="flex:1" data-act="close">Keep fighting</button></div>`, true);
    },
    bquit: () => { closeOverlay(); endBattle(); },
    bdone: () => { const p = postId(); UI.tab = 'city'; endBattle(); if (p) playScene(p).then(() => render()); },
    bretry: () => {
      const p = postId(), mode = BT.mode, data = BT.data;
      endBattle();
      const go = () => { if (mode === 'stage') startBattle('stage', data); else { UI.tab = 'arena'; render(); } };
      if (p) playScene(p).then(go); else go();
    },
    bnext: () => { const p = postId(), {r, s} = BT.data; endBattle(); const go = () => openStage(r, s + 1); if (p) playScene(p).then(go); else go(); },
    profile: () => openProfile(),
    saveName: () => {
      const v = Online.clean($('#nmIn').value.trim());
      if (!v) return toast('Type a name');
      G.name = v; save(); renderTop(); closeOverlay(); Online.pushArena(); Online.presence(); toast('Name saved');
    },
    replayTut: () => { closeOverlay(); UI.tab = 'city'; if (!G.seals.g) G.seals.g = 1; render(); Tut.start(); },
    reset: () => confirmBox('Erase all progress and start from scratch?', 'Erase and restart', () => {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      const keepName = G.name;
      G = null; G = load(); G.name = keepName; save(); UI.tab = 'city'; UI.cityScroll = null; render(); startFlow();
    }),
    login: () => openLogin(),
    claimLogin: () => {
      if (!loginReady()) return;
      const r = LOGIN[G.login.n % 7];
      give(r); G.login.n++; G.login.last = today(); G.lastDaily = today();
      save(); renderTop(); renderTabs(); toast('Login bonus claimed!'); openLogin(); if (UI.tab === 'city') refreshView();
    },
    qtab: d => { UI.qtab = d.v; openQuests(); },
    mclaim: d => {
      const m = MISSIONS.find(x => x.id === d.k); if (!m || G.ach[m.id]) return;
      const t = m.test(G); if (t[0] < t[1]) return;
      G.ach[m.id] = 1; give(m.r); save(); renderTop(); renderTabs(); toast('Mission complete!'); openQuests();
    },
    freeSum: () => { if (freeReady()) doSummon('s', 1, true); },
    pickStarter: d => { UI.starter = +d.i; chooseStarter(); },
    confirmStarter: () => {
      const st = STARTERS[UI.starter || 0];
      const m = addMon(st.f, st.el, 3, 1); m.nu = 0;
      G.team = [m.id]; G.def = [m.id]; save();
      closeOverlay();
      playScene('starter').then(() => { G.tut = 1; save(); UI.tab = 'city'; UI.cityScroll = null; render(); setTimeout(() => scrollCityTo('gate'), 80); });
    },
    screen: () => openScreen(),
    fs: () => { closeOverlay(); goFull(false); },
    rotate: () => { closeOverlay(); goFull(true); },
    fsExit: () => { closeOverlay(); try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} try { screen.orientation.unlock(); } catch (e) {} },
    introGo: () => {
      const v = Online.clean(($('#nmIn0').value || '').trim()) || 'Commander';
      G.name = v; save(); closeOverlay(); renderTop(); Online.presence();
      playScene('intro').then(chooseStarter);
    }
  };

  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (!a || a.disabled) return;
    const act = a.dataset.act, f = ACT[act];
    if (!f) return;
    e.preventDefault();
    const d = a.dataset;
    f(d, a, e);
    Tut.hit([act, act + ':' + (d.t || d.k || d.r || '')]);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#overlay').classList.contains('on') && $('#overlay [data-act="close"]')) closeOverlay();
    if (e.key === 'Enter' && e.target && e.target.id === 'nmIn0') ACT.introGo();
    if (e.key === 'Enter' && e.target && e.target.id === 'nmIn') ACT.saveName();
  });
  addEventListener('resize', () => Tut.update());

  const VIEWS = {city: viewCity, map: viewMap, summon: viewSummon, box: viewBox, arena: viewArena};

  function boot(){
    document.body.insertAdjacentHTML('afterbegin', ART.defs + SCENE.defs);
    G = load();
    dailyReset();
    render();
    const sp = document.createElement('div');
    sp.className = 'splash';
    sp.innerHTML = `<div class="sp-hero">${SCENE.hero()}</div><div class="sp-txt"><div class="logo">Hyakki<small>Legends</small></div><div class="sp-tag">Summon the yokai of old Japan</div>
      <button class="tap" id="spGo">Tap to start</button><button class="sp-fs" id="spFs">${FS_ICON}Play full screen</button></div>`;
    sp.onclick = e => { const fs = e.target.closest('#spFs'); sp.remove(); if (fs) goFull(true); startFlow(); };
    document.body.appendChild(sp);
    Online.init();
    setInterval(() => { if (!BT && UI.tab === 'city' && !$('#overlay').classList.contains('on')) refreshView(); }, 60000);
  }

  return {
    boot,
    state: () => G,
    adopt: g => { if (!g || (g.v | 0) < 4) return; G = fix(g); try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} if (!BT) render(); },
    save, mon, toast,
    refresh: () => { if (!BT) render(); },
    refreshTop: () => { if (!BT) renderTop(); },
    onOnline: () => { if (!BT && UI.tab === 'arena' && !$('#overlay').classList.contains('on')) refreshView(); }
  };
})();

App.boot();
</script>

</body></html>
