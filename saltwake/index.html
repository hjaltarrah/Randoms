/* Layout: one handheld "ship's instrument" with a 3:2 handheld-era screen on top and controls below, centred on a night-sea page.
   In-game windows use clean white handheld-style frames. Single dark look by design. */
:root {
  --sea: #0c1424;
  --hull: #17263c;
  --hull-hi: #22385a;
  --hull-lo: #0f1a2c;
  --brass: #d6a54a;
  --teal: #2a8a84;
  --flare: #e0632b;
  --text: #e9eef7;
  --muted: #9fb0c8;
  /* in-game windows */
  --box: #fbfbf7;
  --box-2: #eef2f7;
  --frame: #3a4152;
  --frame-hi: #96b2d4;
  --txt: #383838;
  --txt-sh: #d3d3cb;
  --sel: #e6eef9;
  --f-ui: 'SW Digits', 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --f-title: 'Pirata One', 'Palatino Linotype', Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
/* the game is English and must always read left-to-right, even on phones set to Arabic */
#app, #app * { direction: ltr; unicode-bidi: isolate; }
#app { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
body {
  margin: 0; background: var(--sea); color: var(--text); font-family: var(--f-ui);
  overscroll-behavior: none; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sea); }
#app {
  min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 18px;
  background: radial-gradient(ellipse at 50% 0%, #1b2c4a 0%, var(--sea) 70%);
}
#console {
  width: min(100%, 560px, calc((100dvh - 250px) * 1.5));
  min-width: min(100%, 280px);
  background: linear-gradient(180deg, var(--hull-hi), var(--hull) 30%, var(--hull-lo));
  border: 2px solid #31496e; border-radius: 18px 18px 34px 34px;
  box-shadow: 0 18px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
  padding: 12px 12px 16px; box-sizing: border-box; position: relative;
}
#bezel { background: #0a0f1a; border-radius: 10px; padding: 8px; box-shadow: inset 0 2px 6px rgba(0,0,0,.7); position: relative; }
#bezel::after { content: "SALTWAKE"; position: absolute; left: 12px; bottom: -2px; transform: translateY(100%); font: 600 10px var(--f-ui); letter-spacing: .28em; color: var(--brass); opacity: .75; }
#screen {
  position: relative; width: 100%; aspect-ratio: 240 / 160; overflow: hidden; background: #000; border-radius: 3px;
  --u: 1.6px; font-size: calc(var(--u) * 9.5); line-height: 1.32; color: var(--txt); touch-action: none;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
#hud, #menus { position: absolute; inset: 0; pointer-events: none; }
#hud > *, #menus > * { pointer-events: auto; }
#fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; z-index: 30; }

/* dialog — white handheld-style window, two lines */
#dlg {
  position: absolute; left: calc(var(--u) * 2); right: calc(var(--u) * 2); bottom: calc(var(--u) * 2); height: calc(var(--u) * 46);
  background: var(--box); border: calc(var(--u) * 2) solid var(--frame); border-radius: calc(var(--u) * 5);
  box-shadow: inset 0 0 0 calc(var(--u) * 1.2) #fff, inset 0 0 0 calc(var(--u) * 2.4) var(--frame-hi); box-sizing: border-box;
  padding: calc(var(--u) * 6) calc(var(--u) * 11) calc(var(--u) * 5); z-index: 12; font-size: calc(var(--u) * 10); line-height: 1.38; cursor: pointer;
  color: var(--txt); text-shadow: calc(var(--u) * .7) calc(var(--u) * .7) 0 var(--txt-sh);
}
#dlg.battle { background: #2c3c54; border-color: #141c28; box-shadow: inset 0 0 0 calc(var(--u) * 1.2) #44587a, inset 0 0 0 calc(var(--u) * 2.4) #9fb8d8; color: #fbfbfb; text-shadow: calc(var(--u) * .7) calc(var(--u) * .7) 0 #121a26; }
#dlg.narrow #dlgText { margin-right: calc(var(--u) * 104); }
#dlgText { height: 100%; white-space: pre-wrap; overflow: hidden; overflow-wrap: anywhere; }
.dlg-measure { position: absolute; top: 0; left: 0; visibility: hidden; white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: none; }
#dlgName {
  position: absolute; top: calc(var(--u) * -11); left: calc(var(--u) * 8); background: var(--teal); color: #fff; text-shadow: none;
  border: calc(var(--u) * 1.5) solid var(--frame); border-radius: calc(var(--u) * 3); padding: 0 calc(var(--u) * 6);
  font-size: calc(var(--u) * 8.5); line-height: calc(var(--u) * 12); font-weight: 600; letter-spacing: .02em;
}
#dlgArrow {
  position: absolute; right: calc(var(--u) * 9); bottom: calc(var(--u) * 5); width: 0; height: 0;
  border-left: calc(var(--u) * 4) solid transparent; border-right: calc(var(--u) * 4) solid transparent; border-top: calc(var(--u) * 5) solid var(--flare);
  animation: bob .55s ease-in-out infinite alternate;
}
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(calc(var(--u) * 2)); } }

/* panels & menus */
.panel {
  position: absolute; background: var(--box); color: var(--txt); border: calc(var(--u) * 2) solid var(--frame);
  border-radius: calc(var(--u) * 5); box-sizing: border-box; z-index: 14; font-size: calc(var(--u) * 9.5);

      case 'door': this.noise(0.35, 0.35, 0, 400, 'bandpass', 2400); this.tone(180, 0.18, 'triangle', 0.25, 0.02, 120); break;

      case 'hitSuper': this.noise(0.24, 0.7, 0, 1400, 'bandpass', 200); this.tone(240, 0.2, 'sawtooth', 0.28, 0, 50); this.tone(90, 0.25, 'triangle', 0.6, 0.02, 40); break;
      case 'hitWeak': this.noise(0.09, 0.3, 0, 2400, 'bandpass', 1200); break;
      case 'faint': this.tone(700, 0.6, 'p25', 0.22, 0, 90); this.noise(0.4, 0.12, 0.2, 300, 'lowpass', 80); break;
      case 'shake': this.tone(330, 0.05, 'triangle', 0.4); this.noise(0.04, 0.2, 0, 1200, 'bandpass'); this.tone(260, 0.05, 'triangle', 0.35, 0.08); break;
      case 'encounter': this.noise(0.5, 0.25, 0, 300, 'bandpass', 3000); this.arp([64, 67, 71, 76, 79, 83], 0.04, 'lead', 0.25); break;
      case 'trainer': this.arp([76, 0, 76, 83], 0.07, 'lead50', 0.32); break;
      case 'shiny': this.arp([95, 100, 103, 107], 0.06, 'bell', 0.45); this.arp([100, 107], 0.06, 'bell', 0.3, 0.3); break;
      case 'throw': this.noise(0.3, 0.3, 0, 600, 'bandpass', 3500); this.tone(400, 0.25, 'p12', 0.1, 0, 900); break;
      case 'stat': this.arp([72, 76, 79, 84], 0.05, 'soft', 0.4); break;
      case 'statdown': this.arp([84, 79, 76, 72], 0.05, 'soft', 0.4); break;
      case 'coin': this.arp([95, 100], 0.06, 'bell', 0.5); break;
      case 'rumble': for (let i = 0; i < 6; i++) this.noise(0.45, 0.4, i * 0.25, 120, 'lowpass', 60); this.tone(55, 1.6, 'sawtooth', 0.18, 0, 40); break;
      case 'thunder': this.noise(1.1, 0.8, 0, 2000, 'lowpass', 80); break;
      case 'run': this.noise(0.3, 0.3, 0, 800, 'bandpass', 4000); break;
      case 'heal': case 'item': case 'caught': case 'badge': case 'levelup': case 'evolve': case 'save': Music.jingle(name); break;
      default: break;
    }
  },
  /* every species gets its own cry, built from its name */
  cry(sp, faint) {
    if (!this.on || !this.ctx) return;
    try {
      const c = this.ctx, h = hashStr('cry:' + sp);
      const rnd = mulberry32(h);
      const base = 220 + rnd() * 520, len = (0.32 + rnd() * 0.3) * (faint ? 1.6 : 1);
      const ratio = [1.5, 2, 2.5, 3, 3.5, 0.5][Math.floor(rnd() * 6)], idx = 1 + rnd() * 4;
      const shape = Math.floor(rnd() * 4);
      const t = c.currentTime + 0.02;
      const car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain(), g = c.createGain();
      car.type = rnd() < 0.5 ? 'sawtooth' : 'square';
      const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 2400 + rnd() * 2000;
      const f0 = faint ? base * 0.8 : base;
      const pts = shape === 0 ? [1, 1.5, 1.1, 0.8] : shape === 1 ? [0.8, 1.3, 1.6, 1.0] : shape === 2 ? [1.4, 1.0, 1.3, 0.7] : [1, 0.85, 1.25, 0.9];
      car.frequency.setValueAtTime(f0 * pts[0], t);
      pts.slice(1).forEach((p, i) => car.frequency.linearRampToValueAtTime(f0 * p * (faint ? 0.6 + 0.4 * (1 - i / 3) : 1), t + len * (i + 1) / 3));
      mod.frequency.value = f0 * ratio; mg.gain.value = f0 * idx;
      mod.connect(mg); mg.connect(car.frequency);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.28, t + 0.02); g.gain.setValueAtTime(0.24, t + len * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      car.connect(fl); fl.connect(g); g.connect(this.sfx);
      car.start(t); mod.start(t); car.stop(t + len + 0.05); mod.stop(t + len + 0.05);
    } catch (e) { /* ignore */ }
  },
};

const Music = {
  want: null, cur: null, curGain: null, timer: null, t0: 0, pos: 0, built: new Map(), on: true, jingleUntil: 0,
  song(id) { if (!this.built.has(id)) this.built.set(id, buildSong(id)); return this.built.get(id); },
  ready() { if (this.want && !this.cur) this.start(this.want); },
  play(id) {
    if (!SONGS[id]) return;
    this.want = id;
    if (!Sound.ctx || !this.on || !Sound.on) return;
    if (this.cur && this.cur.id === id) return;
    this.start(id);
  },
  stop(fade) {
    this.want = null;
    this.fadeOut(fade == null ? 0.4 : fade);
  },
  fadeOut(sec) {
    const c = Sound.ctx;
    if (this.curGain && c) { const g = this.curGain; g.gain.cancelScheduledValues(c.currentTime); g.gain.setTargetAtTime(0.0001, c.currentTime, Math.max(0.01, sec / 3)); setTimeout(() => { try { g.disconnect(); } catch (e) { /* gone */ } }, sec * 1000 + 600); }
    this.curGain = null; this.cur = null;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  },
  start(id) {
    const c = Sound.ctx; if (!c) return;
    this.fadeOut(0.35);
    const S = this.song(id);
    const g = c.createGain(); g.gain.value = 0.0001; g.gain.setTargetAtTime(1, c.currentTime + 0.05, 0.12); g.connect(Sound.mus);
    // a light echo on the lead for that handheld room sound
    const delay = c.createDelay(1); delay.delayTime.value = (60 / S.bpm) * 0.75; const fb = c.createGain(); fb.gain.value = S.echo || 0; const dl = c.createGain(); dl.gain.value = (S.echo || 0) * 0.9;
    delay.connect(fb); fb.connect(delay); delay.connect(dl); dl.connect(g);
    this.cur = S; this.curGain = g; this.lead = { delay };
    this.t0 = c.currentTime + 0.08; this.next = 0;
    const unit = 60 / S.bpm / 4;
    const tick = () => {
      if (!this.cur || this.cur !== S) return;
      const now = c.currentTime, horizon = now + 0.18;
      while (this.t0 + this.next * unit < horizon) {
        const u = this.next, loopU = u % S.len, base = this.t0 + (u - loopU) * unit;
        for (const tr of S.tracks) {
          const list = tr.at.get(loopU);
          if (!list) continue;
          for (const ev of list) {
            const t = base + loopU * unit;
            if (t < now - 0.05) continue;
            if (tr.drums) Sound.drum(g, t, ev[2], tr.vol);
            else for (const n of ev[2]) {
              Sound.note(g, t, n, ev[1] * unit * 0.95, tr.inst, tr.vol / Math.sqrt(ev[2].length));
              if (tr.echo && S.echo) Sound.note(delay, t, n, ev[1] * unit * 0.95, tr.inst, tr.vol * 0.7);
            }
          }
        }
        this.next++;
      }
    };
    tick();
    this.timer = setInterval(tick, 30);
  },
  /* fanfares: duck the music, play, then bring it back */
  jingle(id) {
    const J = JINGLES[id], c = Sound.ctx;
    if (!J || !c || !Sound.on) return Promise.resolve();
    const unit = 60 / J.bpm / 4, t0 = c.currentTime + 0.03;
    const m = parseMel(J.mel);
    if (this.curGain) { this.curGain.gain.cancelScheduledValues(t0); this.curGain.gain.setTargetAtTime(0.12, t0, 0.04); }
    for (const [t, d, ns] of m.ev) for (const n of ns) Sound.note(Sound.sfx, t0 + t * unit, n, d * unit, J.lead, 0.42 / Math.sqrt(ns.length));
    if (J.pad) { const ch = chordOf(J.pad); const ns = ch.iv.map((iv) => 48 + ch.root + iv); for (const n of ns) Sound.note(Sound.sfx, t0, n, J.len * unit * 0.9, 'pad', 0.12); }
    const ms = J.len * unit * 1000 + 200;
    const g = this.curGain;
    setTimeout(() => { if (g && this.curGain === g) g.gain.setTargetAtTime(1, Sound.ctx.currentTime, 0.25); }, ms);
    return wait(ms);
  },
};
SW.Sound = Sound; SW.Music = Music;

/* ---------------- Mon helpers ---------------- */
const STAT_KEYS = ['hp', 'atk', 'def', 'spc', 'spe'];
const STAT_NAMES = { hp: 'HP', atk: 'Attack', def: 'Defense', spc: 'Special', spe: 'Speed', acc: 'accuracy', eva: 'evasion' };
function expFor(lvl) { return lvl <= 1 ? 0 : lvl * lvl * lvl; }
function calcStats(mon) {
  const sp = SPECIES[mon.sp], L = mon.lvl, o = {};
  for (let i = 0; i < 5; i++) {
    const v = Math.floor(((2 * sp.b[i] + mon.iv[i]) * L) / 100);
    o[STAT_KEYS[i]] = i === 0 ? v + L + 10 : v + 5;
  }
  return o;
}
function maxHp(mon) { return calcStats(mon).hp; }
function monName(mon) { return mon.nick || SPECIES[mon.sp].n; }
function isFainted(mon) { return mon.hp <= 0; }
function learnedUpTo(sp, lvl) {
  const out = [];
  for (const [l, m] of SPECIES[sp].learn) {
    if (l > lvl) continue;
    const i = out.indexOf(m);
    if (i >= 0) out.splice(i, 1);
    out.push(m);
  }
  return out.slice(-4);
}
function rollShiny() { return Math.random() < 1 / SHINY_ODDS; }
function makeMon(sp, lvl, opts) {
  opts = opts || {};
  const iv = opts.iv || [0, 0, 0, 0, 0].map(() => ri(0, 31));
  const mon = {
    uid: newId(), sp, lvl, exp: expFor(lvl), iv,
    hp: 1, st: null, sl: 0,
    moves: (opts.moves || learnedUpTo(sp, lvl)).map((id) => ({ id, pp: MOVES[id].pp })),
    shiny: opts.shiny !== undefined ? !!opts.shiny : rollShiny(),
    ot: opts.ot || '', met: opts.met || '',
  };
  mon.hp = maxHp(mon);
  return mon;
}
function healMon(mon) {
  mon.hp = maxHp(mon); mon.st = null; mon.sl = 0;
  for (const m of mon.moves) m.pp = MOVES[m.id].pp;
}
function monValid(m) {
  return m && SPECIES[m.sp] && Number.isFinite(m.lvl) && Array.isArray(m.moves) && m.moves.length > 0 && m.moves.every((x) => MOVES[x.id]);
}

/* ---- 03_art_mon ---- */
/* ============================================================
   Saltwake — Tideling sprites, drawn with shapes then snapped
   to a palette and outlined so they read as pixel art.
   ============================================================ */
const MonArt = (() => {
  const SZ = 64;
  const OUT = '#1c1428';
  const cache = new Map();
  const urlCache = new Map();

  function helper(ctx, used) {
    const reg = (c) => { used.add(c); return c; };
    return {
      ctx,
      E(cx, cy, rx, ry, c, rot) { ctx.fillStyle = reg(c); ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(0.5, rx), Math.max(0.5, ry), rot || 0, 0, TAU); ctx.fill(); },
      C(cx, cy, r, c) { this.E(cx, cy, r, r, c); },
      R(x, y, w, h, c) { ctx.fillStyle = reg(c); ctx.fillRect(x, y, w, h); },
      P(pts, c) { ctx.fillStyle = reg(c); ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); },
      L(x1, y1, x2, y2, w, c) { ctx.strokeStyle = reg(c); ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); },
      Q(x1, y1, cx, cy, x2, y2, w, c) { ctx.strokeStyle = reg(c); ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke(); },
      B(x1, y1, a, b, c2, d, x2, y2, w, c) { ctx.strokeStyle = reg(c); ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.bezierCurveTo(a, b, c2, d, x2, y2); ctx.stroke(); },
      D(x, y, c) { ctx.fillStyle = reg(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); },
      blob(cx, cy, rx, ry, base, dark, light, rot) {
        this.E(cx + rx * 0.08, cy + ry * 0.1, rx, ry, dark, rot);
        this.E(cx - rx * 0.06, cy - ry * 0.07, rx * 0.9, ry * 0.88, base, rot);
        if (light) this.E(cx - rx * 0.36, cy - ry * 0.42, rx * 0.34, ry * 0.24, light, (rot || 0) - 0.5);
      },
      eye(cx, cy, rx, ry, c) {
        this.E(cx, cy, rx, ry, c || '#1c1828');
        const w = Math.max(1, Math.round(rx * 0.7)), h = Math.max(1, Math.round(ry * 0.55));
        this.R(Math.round(cx - rx * 0.7), Math.round(cy - ry * 0.75), w, h, '#ffffff');
      },
      star(cx, cy, r, c) { this.R(cx - r, cy, 2 * r + 1, 1, c); this.R(cx, cy - r, 1, 2 * r + 1, c); },
      leaf(sx, sy, ang, len, w, c) {
        const cx = sx + Math.sin(ang) * len * 0.55, cy = sy - Math.cos(ang) * len * 0.55;
        this.E(cx, cy, w, len * 0.55, c, ang);
      },
    };
  }

const PIX = (() => {
  const cache = new Map();
  const rgb = new Map();
  const toRgb = (c) => { let v = rgb.get(c); if (!v) { v = [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; rgb.set(c, v); } return v; };
  /* canvas for template `name` coloured with palette `pal` (a PIXP key or a palette object with an id) */
  function get(name, pal) {
    const pid = typeof pal === 'string' ? pal : pal.id;
    const key = name + '|' + pid;
    let cv = cache.get(key);
    if (cv) return cv;
    const t = PIXT[name], p = typeof pal === 'string' ? PIXP[pal] : pal;
    if (!t || !p) throw new Error('pix ' + key);
    const h = t.length, w = t[0].length;
    cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) {
      const row = t[y];
      for (let x = 0; x < w; x++) {
        const col = p[row[x]];
        if (!col) continue;
        const c = toRgb(col), i = (y * w + x) * 4;
        d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    cache.set(key, cv);
    return cv;
  }
  /* colour of one template pixel (or null when transparent) */
  function px(name, pal, x, y) {
    const t = PIXT[name], p = typeof pal === 'string' ? PIXP[pal] : pal;
    const row = t[y]; if (!row) return null;
    return p[row[x]] || null;
  }
  /* copy of a template canvas keeping only pixels whose template char is in `chars` (for overlays) */
  function mask(name, pal, chars, fromRow) {
    const key = name + '|' + (typeof pal === 'string' ? pal : pal.id) + '|m' + chars + (fromRow || 0);
    let cv = cache.get(key);
    if (cv) return cv;
    const t = PIXT[name], p = typeof pal === 'string' ? PIXP[pal] : pal;
    const h = t.length, w = t[0].length;
    cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    for (let y = fromRow || 0; y < h; y++) for (let x = 0; x < w; x++) {

      if (!chars.includes(ch) || !p[ch]) continue;
      ctx.fillStyle = p[ch]; ctx.fillRect(x, y, 1, 1);
    }
    cache.set(key, cv);
    return cv;
  }
  return { get, px, mask };

/* tile solidity */
function tileSolid(map, ch) {
  if (map.theme === 'outdoor') return '~t#fSRxTG'.includes(ch) && ch !== 'G';
  if (map.theme === 'cave') return ch === '#' || ch === '~' || ch === 'R' || ch === 'P';
  return 'WwMQNBbTcpxHkLsP'.includes(ch);
}

/* ============================================================
   Saltwake — input: keyboard, touch D-pad, buttons, touch-to-walk
   ============================================================ */
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const Input = {
  held: { up: 0, down: 0, left: 0, right: 0, a: 0, b: 0, start: 0 },
  stack: [],
  worldQueue: [],
  dirOrder: [],
  touchDir: null,
  tap: null,
  repeatTimer: null, repeatKey: null,
  push(fn) {
    this.stack.push(fn);
    this.worldQueue.length = 0;
    this.tap = null;
    return () => { const i = this.stack.lastIndexOf(fn); if (i >= 0) this.stack.splice(i, 1); };
  },
  top() { return this.stack[this.stack.length - 1]; },
  hook: null,
  press(k) {
    Sound.init();
    if (this.held[k]) return;
    this.held[k] = 1;
    if (this.hook && this.hook(k)) return;
    if (DIRS[k]) {
      this.dirOrder = this.dirOrder.filter((d) => d !== k); this.dirOrder.push(k);
      // remember quick taps so a press shorter than one frame still takes a step
      if (!this.top()) this.tap = { d: k, t: performance.now() };
    }
    this.dispatch(k);
    if (DIRS[k]) this.startRepeat(k);
  },
  dispatch(k) {
    const h = this.top();
    if (h) { try { h(k); } catch (e) { console.error(e); } }
    else if (!DIRS[k]) this.worldQueue.push(k);
  },
  release(k) {
    if (!this.held[k]) return;
    this.held[k] = 0;
    if (DIRS[k]) this.dirOrder = this.dirOrder.filter((d) => d !== k);
    if (this.repeatKey === k) this.stopRepeat();
  },
  releaseAll() { for (const k in this.held) this.held[k] = 0; this.dirOrder = []; this.touchDir = null; this.stopRepeat(); },
  startRepeat(k) {
    this.stopRepeat();
    this.repeatKey = k;
    this.repeatTimer = setTimeout(() => {
      this.repeatTimer = setInterval(() => { if (this.held[k] && this.top()) this.top()(k); }, 105);
    }, 330);
  },
  stopRepeat() { clearTimeout(this.repeatTimer); clearInterval(this.repeatTimer); this.repeatTimer = null; this.repeatKey = null; },
  /* direction for walking: keys / D-pad first, then a finger held on the screen, then a buffered quick tap */
  dir() {
    if (this.dirOrder.length) return this.dirOrder[this.dirOrder.length - 1];
    if (this.touchDir) return this.touchDir;
    if (this.tap && performance.now() - this.tap.t < 320) return this.tap.d;
    this.tap = null;
    return null;
  },
  usedDir() { this.tap = null; },
  takeWorld(k) { const i = this.worldQueue.indexOf(k); if (i >= 0) { this.worldQueue.splice(i, 1); return true; } return false; },

  init() {
    const KEYMAP = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
      KeyZ: 'a', KeyJ: 'a', Space: 'a', Enter: 'a',
      KeyX: 'b', KeyK: 'b', Escape: 'b', Backspace: 'b',
      KeyM: 'start', Tab: 'start', ShiftLeft: 'start', ShiftRight: 'start',
    };
    const typing = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); };
    window.addEventListener('keydown', (e) => {
      if (typing()) return;
      if (e.code === 'KeyF' && !e.repeat && typeof Shell !== 'undefined') { e.preventDefault(); Shell.toggle(); return; }
      const k = KEYMAP[e.code];
      if (!k) return;
      e.preventDefault();
      if (e.repeat) return;
      this.press(k);
    });
    window.addEventListener('keyup', (e) => {
      const k = KEYMAP[e.code];
      if (!k) return;
      this.release(k);
    });
    window.addEventListener('blur', () => this.releaseAll());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.releaseAll(); });

    /* convert a viewport-space vector into game-space (the whole console may be rotated 90deg in fullscreen) */
    const toGame = (vx, vy) => ((typeof Shell !== 'undefined' && Shell.rot) ? [vy, -vx] : [vx, vy]);

    // ---- D-pad: the pad element itself is the only touch target; direction comes from the finger position.
    const dpad = document.getElementById('dpad');
    let dpId = null, cur = null;
    const setDir = (d) => {
      if (d === cur) return;
      if (cur) this.release(cur);
      cur = d;
      if (d) this.press(d);
      for (const el of dpad.querySelectorAll('.dp')) el.classList.toggle('on', el.dataset.d === d);
    };
    const fromPoint = (e) => {
      const r = dpad.getBoundingClientRect();
      const [x, y] = toGame(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
      if (Math.hypot(x, y) < Math.min(r.width, r.height) * 0.08) return cur;
      return Math.abs(x) > Math.abs(y) ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');
    };
    const dpEnd = (e) => { if (dpId !== null && e.pointerId === dpId) { dpId = null; setDir(null); } };
    dpad.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      dpId = e.pointerId;
      try { dpad.setPointerCapture(e.pointerId); } catch (_) { /* capture is optional */ }
      setDir(fromPoint(e));
    });
    dpad.addEventListener('pointermove', (e) => { if (e.pointerId === dpId) setDir(fromPoint(e)); });
    dpad.addEventListener('pointerup', dpEnd);
    dpad.addEventListener('pointercancel', dpEnd);
    window.addEventListener('pointerup', dpEnd, true);
    window.addEventListener('pointercancel', dpEnd, true);
    dpad.addEventListener('contextmenu', (e) => e.preventDefault());
    // Fallback for very old web views without Pointer Events
    if (!window.PointerEvent) {
      const tdir = (t) => fromPoint({ clientX: t.clientX, clientY: t.clientY });
      dpad.addEventListener('touchstart', (e) => { e.preventDefault(); setDir(tdir(e.changedTouches[0])); }, { passive: false });
      dpad.addEventListener('touchmove', (e) => { e.preventDefault(); setDir(tdir(e.changedTouches[0])); }, { passive: false });
      dpad.addEventListener('touchend', (e) => { e.preventDefault(); setDir(null); }, { passive: false });
      dpad.addEventListener('touchcancel', () => setDir(null));
    }

    // ---- A / B / MENU buttons
    for (const [id, k] of [['bA', 'a'], ['bB', 'b'], ['bMenu', 'start']]) {
      const el = document.getElementById(id);
      let pid = null;
      const up = (e) => { if (pid === null || (e && e.pointerId !== undefined && e.pointerId !== pid)) return; pid = null; el.classList.remove('on'); this.release(k); };
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault(); e.stopPropagation();
        pid = e.pointerId; el.classList.add('on');
        try { el.setPointerCapture(e.pointerId); } catch (_) { /* optional */ }
        this.press(k);
      });
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
      window.addEventListener('pointerup', up, true); window.addEventListener('pointercancel', up, true);
      el.addEventListener('contextmenu', (e) => e.preventDefault());
      if (!window.PointerEvent) {
        el.addEventListener('touchstart', (e) => { e.preventDefault(); pid = 0; el.classList.add('on'); this.press(k); }, { passive: false });
        el.addEventListener('touchend', (e) => { e.preventDefault(); pid = null; el.classList.remove('on'); this.release(k); }, { passive: false });
      }
    }
    document.getElementById('pad').addEventListener('touchstart', (e) => { if (e.target.closest('#dpad, .ab, #bMenu, #bFull')) e.preventDefault(); }, { passive: false });

    // ---- touch-to-walk: hold a finger on the game screen and the hero walks toward it
    const cv = document.getElementById('cv');
    let sId = null, sT = 0, sX = 0, sY = 0, sMoved = false, lastPt = null;
    const gamePoint = (e) => {
      const r = cv.getBoundingClientRect();
      if (typeof Shell !== 'undefined' && Shell.rot) return [((e.clientY - r.top) / r.height) * VIEW_W, ((r.right - e.clientX) / r.width) * VIEW_H];
      return [((e.clientX - r.left) / r.width) * VIEW_W, ((e.clientY - r.top) / r.height) * VIEW_H];
    };
    const worldFree = () => typeof G !== 'undefined' && G.mode === 'world' && G.map && !G.lock && !this.top();
    const aimFrom = (pt) => {
      const p = G.player;
      const px = p.px - G.cam.x + 8, py = p.py - G.cam.y + 8;
      const dx = pt[0] - px, dy = pt[1] - py;
      if (Math.abs(dx) < 9 && Math.abs(dy) < 9) return null;
      return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    };
    cv.addEventListener('pointerdown', (e) => {
      Sound.init();
      if (!worldFree()) {
        // tapping the picture while a message is showing (and no menu is open) works like the A button
        if (typeof UI !== 'undefined' && UI.dlg && !UI.dlg.hidden && this.top() && !document.querySelector('#menus .panel')) {
          e.preventDefault(); this.press('a'); this.release('a');
        }
        return;
      }
      e.preventDefault();
      sId = e.pointerId; sT = performance.now(); sX = e.clientX; sY = e.clientY; sMoved = false;
      try { cv.setPointerCapture(e.pointerId); } catch (_) { /* optional */ }
      lastPt = gamePoint(e);
      this.touchDir = aimFrom(lastPt);
      if (this.touchDir) this.tap = { d: this.touchDir, t: performance.now() };
    });
    cv.addEventListener('pointermove', (e) => {
      if (e.pointerId !== sId) return;
      if (Math.hypot(e.clientX - sX, e.clientY - sY) > 12) sMoved = true;
      lastPt = gamePoint(e);
      this.touchDir = typeof G !== 'undefined' && G.map ? aimFrom(lastPt) : null;
    });
    const sEnd = (e) => {
      if (sId === null || e.pointerId !== sId) return;
      sId = null; this.touchDir = null;
      const quick = performance.now() - sT < 260 && !sMoved;
      if (!quick || !lastPt || !worldFree() || G.player.moving) return;
      // a quick tap on the hero or on the tile right next to them = A button (talk, read, pick up)
      const p = G.player;
      const tx = Math.floor((lastPt[0] + G.cam.x) / TS), ty = Math.floor((lastPt[1] + G.cam.y) / TS);
      const ddx = tx - p.x, ddy = ty - p.y;
      if (ddx === 0 && ddy === 0) { this.worldQueue.push('a'); return; }
      if (Math.abs(ddx) + Math.abs(ddy) === 1) {
        const d = ddx > 0 ? 'right' : ddx < 0 ? 'left' : ddy > 0 ? 'down' : 'up';
        if (typeof interactableAt === 'function' && interactableAt(tx, ty)) { p.dir = d; this.tap = null; this.worldQueue.push('a'); }
      }
    };
    cv.addEventListener('pointerup', sEnd); cv.addEventListener('pointercancel', sEnd);
    window.addEventListener('pointerup', sEnd, true); window.addEventListener('pointercancel', sEnd, true);
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
  },
};
SW.Input = Input;

/* ---- 06b_shell ---- */
/* ============================================================
   Saltwake — fullscreen + landscape rotation
   Real fullscreen + orientation lock where the browser allows it;
   otherwise the console fills the page and, if the screen is
   held upright, the whole console is turned 90deg so the game
   plays sideways.
   ============================================================ */
const Shell = {
  fs: false, rot: false, real: false,
  init() {
    const btn = document.getElementById('bFull');
    let pid = null;
    btn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); pid = e.pointerId; btn.classList.add('on'); });
    btn.addEventListener('pointerup', (e) => { if (pid === null || e.pointerId !== pid) return; pid = null; btn.classList.remove('on'); Sound.init(); this.toggle(); });
    btn.addEventListener('pointercancel', () => { pid = null; btn.classList.remove('on'); });
    btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); this.toggle(); } });
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
    const relayout = () => { if (this.fs) this.layout(); };
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', () => setTimeout(relayout, 250));
    const onFs = () => {
      const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (!on && this.real) { this.real = false; if (this.fs) this.exit(true); }
      else relayout();
    };
    document.addEventListener('fullscreenchange', onFs);
    document.addEventListener('webkitfullscreenchange', onFs);
    this.paintIcon();
  },
  paintIcon() {
    const btn = document.getElementById('bFull');
    const open = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>';
    const close = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>';
    btn.innerHTML = (this.fs ? close : open) + '<span>' + (this.fs ? 'EXIT' : 'FULL') + '</span>';
    btn.setAttribute('aria-label', this.fs ? 'Exit full screen' : 'Full screen');
  },
  toggle() { if (this.fs) this.exit(); else this.enter(); },
  async enter() {
    if (this.fs) return;
    this.fs = true;
    document.body.classList.add('fs');
    this.paintIcon();
    this.layout();
    const root = document.documentElement;
    try {
      if (document.fullscreenEnabled && root.requestFullscreen) { await root.requestFullscreen({ navigationUI: 'hide' }); this.real = true; }
      else if (root.webkitRequestFullscreen && document.webkitFullscreenEnabled !== false) { root.webkitRequestFullscreen(); this.real = !!document.webkitFullscreenElement; }
    } catch (e) { this.real = false; }
    if (this.real && screen.orientation && screen.orientation.lock) {
      try { await screen.orientation.lock('landscape'); } catch (e) { /* not allowed here: rotate with CSS instead */ }
    }
    this.layout();
    setTimeout(() => this.layout(), 350);
    setTimeout(() => this.layout(), 900);
  },
  exit(fromBrowser) {
    this.fs = false; this.rot = false;
    document.body.classList.remove('fs', 'rot');
    const app = document.getElementById('app');
    app.style.width = ''; app.style.height = ''; app.style.transform = '';
    for (const v of ['--fs-scr', '--fs-side']) app.style.removeProperty(v);
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) { /* ignore */ }
    if (!fromBrowser && (document.fullscreenElement || document.webkitFullscreenElement)) {
      try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) { /* ignore */ }
    }
    this.real = false;
    this.paintIcon();
    Input.releaseAll();
  },
  layout() {
    if (!this.fs) return;
    const app = document.getElementById('app');
    const vw = window.innerWidth, vh = window.innerHeight;
    this.rot = vh > vw * 1.05;
    document.body.classList.toggle('rot', this.rot);
    const W = this.rot ? vh : vw, H = this.rot ? vw : vh; // landscape box the console fills
    app.style.width = W + 'px'; app.style.height = H + 'px';
    app.style.transform = this.rot ? `translateX(${vw}px) rotate(90deg)` : '';
    // controls on both sides, the screen as big as fits in the middle (3:2)
    let side = clamp(Math.round(H * 0.34), 92, 156);
    let scrH = H - 20, scrW = scrH * 1.5 + 8;
    const room = W - 2 * side - 48;
    if (scrW > room) { scrW = room; }
    if (scrW < W * 0.5) { side = clamp(Math.round((W - W * 0.5 - 48) / 2), 72, 156); scrW = Math.min(scrH * 1.5 + 8, W - 2 * side - 48); }
    app.style.setProperty('--fs-scr', Math.max(160, Math.floor(scrW)) + 'px');
    app.style.setProperty('--fs-side', side + 'px');
  },
};
SW.Shell = Shell;

/* ---- 07_ui ---- */
/* ============================================================
   Saltwake — UI: dialog, menus, panels, fades, banners
   ============================================================ */
const UI = {
  screen: null, dlg: null, dlgText: null, dlgName: null, menus: null, fadeEl: null,
  textSpeed: 2,
  init() {
    this.screen = document.getElementById('screen');
    this.dlg = document.getElementById('dlg');
    this.dlgText = document.getElementById('dlgText');
    this.dlgName = document.getElementById('dlgName');
    this.menus = document.getElementById('menus');
    this.fadeEl = document.getElementById('fade');
    this.measure = document.createElement('div');
    this.measure.className = 'dlg-measure';
    this.dlg.appendChild(this.measure);
    const resize = () => {
      const w = this.screen.clientWidth || 240;
      this.screen.style.setProperty('--u', (w / 240) + 'px');
    };
    // the game screen must never scroll (focus or overflow could otherwise shift everything)
    this.screen.addEventListener('scroll', () => { if (this.screen.scrollTop || this.screen.scrollLeft) { this.screen.scrollTop = 0; this.screen.scrollLeft = 0; } });
    resize();
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(this.screen);
  },
  fmt(t) {
    const s = (typeof G !== 'undefined' && G.save) ? G.save : null;
    return String(t).replace(/\{p\}/g, s ? s.name : 'you').replace(/\{r\}/g, RIVAL);
  },
  paginate(text) {
    const pages = [];
    for (const block of text.split('\f')) {
      const words = block.split(/( |\n)/);
      const m = this.measure;
      m.style.width = (this.dlgText.clientWidth || 200) + 'px';
      const maxH = this.dlgText.clientHeight || 60;
      let cur = '';
      for (const w of words) {
        if (w === '') continue;
        const next = cur + w;
        m.textContent = next;
        if (m.scrollHeight > maxH + 2 && cur.trim()) { pages.push(cur.trim()); cur = w === ' ' || w === '\n' ? '' : w; }
        else cur = next;
      }
      if (cur.trim()) pages.push(cur.trim());
    }
    return pages.length ? pages : [''];
  },
  showDlg(on) { this.dlg.hidden = !on; },
  /* say(text) — shows text, waits for A/B or tap. opts: {keep: true} keeps box open after */
  say(text, opts) {
    opts = opts || {};
    text = this.fmt(text);
    let name = '';
    const m = /^([A-Z][\w .'\-]{0,22}): ([\s\S]*)$/.exec(text);
    if (m && !opts.noName) { name = m[1]; text = m[2]; }
    this.dlgName.hidden = !name;
    this.dlgName.textContent = name;
    this.showDlg(true);
    const pages = this.paginate(text);
    return new Promise((resolve) => {
      let pi = 0, shown = 0, full = false, raf = 0, last = 0;
      const arrow = document.getElementById('dlgArrow');
      const typeOut = () => {
        const page = pages[pi];
        full = false; shown = 0; arrow.hidden = true;
        const step = (now) => {
          if (!last) last = now;
          const cps = this.textSpeed >= 3 ? 999 : this.textSpeed === 2 ? 90 : 45;
          shown = Math.min(page.length, shown + Math.max(1, Math.round(((now - last) / 1000) * cps)));
          last = now;
          this.dlgText.textContent = page.slice(0, shown);
          if (shown >= page.length) { full = true; arrow.hidden = !!opts.auto; if (opts.auto && pi === pages.length - 1) { finish(); } return; }
          raf = requestAnimationFrame(step);
        };
        last = 0;
        raf = requestAnimationFrame(step);
      };
      const advance = () => {
        if (!full) { cancelAnimationFrame(raf); shown = pages[pi].length; this.dlgText.textContent = pages[pi]; full = true; arrow.hidden = false; return; }
        if (pi < pages.length - 1) { pi++; Sound.play('blip'); typeOut(); return; }
        Sound.play('blip');
        finish();
      };
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        pop(); this.dlg.removeEventListener('pointerdown', onTap);
        arrow.hidden = true;
        if (!opts.keep) this.showDlg(false);
        resolve();
      };
      const onTap = (e) => { e.preventDefault(); advance(); };
      this.dlg.addEventListener('pointerdown', onTap);
      const pop = Input.push((k) => { if (k === 'a' || k === 'b') advance(); });
      typeOut();
    });
  },
  /* text shown with no wait; returns when fully typed */
  async note(text) {
    text = this.fmt(text);
    this.dlgName.hidden = true;
    this.showDlg(true);
    const page = this.paginate(text).join(' ');
    this.dlgText.textContent = page;
    document.getElementById('dlgArrow').hidden = true;
  },
  hideDlg() { this.showDlg(false); },
  async ask(text, choices, opts) {
    opts = opts || {};
    await this.say(text, { keep: true, auto: true, noName: opts.noName });
    const r = await this.menu(choices, { cls: 'm-ask', cancel: opts.cancel === undefined ? choices.length - 1 : opts.cancel });
    if (!opts.keep) this.hideDlg();
    return r;
  },
  /* generic list menu. items: string | {label, sub, disabled, right, cls}. opts: cls, title, cancel (value returned on B, false = no cancel), start, cols, onMove */
  menu(items, opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      const el = document.createElement('div');
      el.className = 'panel menu ' + (opts.cls || '');
      if (opts.title) { const t = document.createElement('div'); t.className = 'm-title'; t.textContent = this.fmt(opts.title); el.appendChild(t); }
      if (opts.header) el.appendChild(opts.header);
      const list = document.createElement('div');
      list.className = 'm-list';
      if (opts.cols) list.style.gridTemplateColumns = `repeat(${opts.cols}, 1fr)`;
      el.appendChild(list);
      if (opts.footer) el.appendChild(opts.footer);
      const btns = items.map((it, i) => {
        if (typeof it === 'string') it = { label: it };
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'opt' + (it.disabled ? ' dis' : '') + (it.cls ? ' ' + it.cls : '');
        if (it.style) b.setAttribute('style', it.style);
        if (it.node) b.appendChild(it.node);
        else {
          const lab = document.createElement('span'); lab.className = 'o-label'; lab.textContent = this.fmt(it.label); b.appendChild(lab);
          if (it.right !== undefined) { const r = document.createElement('span'); r.className = 'o-right'; r.textContent = it.right; b.appendChild(r); }
          if (it.sub) { const s = document.createElement('span'); s.className = 'o-sub'; s.textContent = it.sub; b.appendChild(s); }
        }
        b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); });
        b.addEventListener('click', (e) => { e.preventDefault(); if (sel !== i) { sel = i; draw(); } choose(); });
        list.appendChild(b);
        return { b, it };
      });
      this.menus.appendChild(el);
      let sel = clamp(opts.start || 0, 0, Math.max(0, items.length - 1));
      const cols = opts.cols || 1;
      const draw = () => {
        btns.forEach((x, i) => x.b.classList.toggle('sel', i === sel));
        const cur = btns[sel] && btns[sel].b;
        if (cur) UI.keepVisible(cur, list);
        if (opts.onMove) opts.onMove(sel);
      };
      const move = (d) => {
        if (!items.length) return;
        let n = sel + d;
        if (cols > 1) { if (n < 0 || n >= items.length) return; }
        else n = (n + items.length) % items.length;
        sel = n; Sound.play('blip'); draw();
      };
      const choose = () => {
        const x = btns[sel];
        if (!x || x.it.disabled) { Sound.play('bump'); return; }
        Sound.play('ok'); done(sel);
      };
      const done = (v) => { pop(); if (!opts.keep) el.remove(); resolve(v); };
      const pop = Input.push((k) => {
        if (k === 'up') move(-cols);
        else if (k === 'down') move(cols);
        else if (k === 'left' && cols > 1) move(-1);
        else if (k === 'right' && cols > 1) move(1);
        else if (k === 'a') choose();
        else if (k === 'b' && opts.cancel !== false) { Sound.play('back'); done(opts.cancel === undefined ? -1 : opts.cancel); }
      });
      el._close = () => el.remove();
      draw();
    });
  },
  /* scroll a list so the chosen row is visible, without ever scrolling the page or the game screen */
  keepVisible(el, box) {
    if (!box || box.scrollHeight <= box.clientHeight + 1) return;
    const top = el.offsetTop, bot = top + el.offsetHeight;
    if (top < box.scrollTop) box.scrollTop = top;
    else if (bot > box.scrollTop + box.clientHeight) box.scrollTop = bot - box.clientHeight;
  },
  toast(text, ms) {
    const t = document.getElementById('toast');
    t.textContent = this.fmt(text); t.hidden = false;
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => { t.hidden = true; }, ms || 2200);
  },
  banner(name) {
    const b = document.getElementById('banner');
    b.textContent = name;
    b.hidden = false;
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    clearTimeout(this._banT);
    this._banT = setTimeout(() => { b.classList.remove('show'); setTimeout(() => { b.hidden = true; }, 400); }, 2000);
  },
  fade(to, ms, color) {
    const f = this.fadeEl;
    if (color) f.style.background = color;
    const from = parseFloat(f.style.opacity || '0');
    return tween(ms || 250, (t) => { f.style.opacity = String(lerp(from, to, t)); });
  },
  async flash(n, color) {
    for (let i = 0; i < (n || 1); i++) { await this.fade(1, 70, color || '#ffffff'); await this.fade(0, 90); }

  },
  clearMenus() { this.menus.innerHTML = ''; },
  /* full-screen panel helper; returns {el, close} */
  panel(cls) {
    const el = document.createElement('div');
    el.className = 'panel full ' + (cls || '');
    this.menus.appendChild(el);
    return el;
  },
  nameEntry(title, def) {
    return new Promise((resolve) => {
      const el = this.panel('name-entry');
      el.innerHTML = '';
      const h = document.createElement('div'); h.className = 'ne-title'; h.textContent = title; el.appendChild(h);
      const inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 10; inp.value = def || ''; inp.id = 'nameInput';
      inp.autocomplete = 'off'; inp.spellcheck = false; inp.setAttribute('aria-label', title);
      el.appendChild(inp);
      const row = document.createElement('div'); row.className = 'ne-row';
      const ok = document.createElement('button'); ok.type = 'button'; ok.className = 'btn-ok'; ok.textContent = 'OK';
      row.appendChild(ok); el.appendChild(row);
      const hint = document.createElement('div'); hint.className = 'ne-hint'; hint.textContent = 'Up to 10 letters.'; el.appendChild(hint);
      const pop = Input.push(() => {});
      const finish = () => {
        const v = cleanName(inp.value, 10);
        if (!v) { hint.textContent = 'Type a name first.'; inp.focus(); return; }
        pop(); inp.blur(); el.remove(); Sound.play('ok'); resolve(v);
      };
      ok.addEventListener('click', finish);
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); finish(); } });
      setTimeout(() => { try { inp.focus(); inp.select(); } catch (_) {} }, 60);
    });
  },
};

/* ---- 08_battle_core ---- */
/* ============================================================
   Saltwake — battle engine (pure + deterministic: all randomness
   comes from B.rng so link battles resolve identically on both ends)
   ============================================================ */
const Battle = (() => {
  const stageMult = (n) => (n >= 0 ? (2 + n) / 2 : 2 / (2 - n));
  const accMult = (n) => (n >= 0 ? (3 + n) / 3 : 3 / (3 - n));
  const mkCur = (mon) => ({ mon, stg: { atk: 0, def: 0, spc: 0, spe: 0, acc: 0, eva: 0 }, flinch: false, fainted: false });

  function create(o) {
    return {
      kind: o.kind,
      rng: mulberry32((o.seed >>> 0) || 1),
      sides: o.sides.map((s) => ({ name: s.name || '', cls: s.cls || '', look: s.look || '', party: s.party, active: -1, cur: null })),
      turn: 0, over: false, result: null, runs: 0, part: new Set(),
    };
  }
  function firstHealthy(party) { return party.findIndex((m) => m.hp > 0); }
  function start(B) {
    const ev = [];
    sendOut(B, 1, firstHealthy(B.sides[1].party), ev);
    sendOut(B, 0, firstHealthy(B.sides[0].party), ev);
    return ev;
  }
  function sendOut(B, s, i, ev) {
    const side = B.sides[s];
    side.active = i;
    side.cur = mkCur(side.party[i]);
    if (s === 0) B.part.add(side.party[i].uid);
    else if (B.sides[0].cur) B.part = new Set([B.sides[0].cur.mon.uid]);
    ev.push({ t: 'in', s, i });
  }
  function speedOf(B, s) {
    const c = B.sides[s].cur; if (!c) return 0;
    let v = calcStats(c.mon).spe * stageMult(c.stg.spe);
    if (c.mon.st === 'shk') v *= 0.5;
    return Math.floor(v);
  }
  function needs(B) {
    if (B.over) return { type: 'over' };
    const r = [false, false]; let any = false;
    for (let s = 0; s < 2; s++) {
      const sd = B.sides[s];
      if (!sd.cur || sd.cur.mon.hp <= 0) { if (sd.party.some((m) => m.hp > 0)) { r[s] = true; any = true; } }
    }
    return any ? { type: 'replace', sides: r } : { type: 'turn' };
  }
  function end(B, result, ev) {
    if (B.over) return;
    B.over = true; B.result = result; ev.push({ t: 'end', result });
  }
  function decideEnd(B, ev) {
    if (B.over) return;
    const alive = (s) => B.sides[s].party.some((m) => m.hp > 0);
    if (B.kind === 'wild' && B.sides[1].cur.mon.hp <= 0) { end(B, 'win', ev); return; }
    const a0 = alive(0), a1 = alive(1);
    if (!a0 && !a1) end(B, 'draw', ev);
    else if (!a1) end(B, 'win', ev);
    else if (!a0) end(B, 'lose', ev);
  }
  function checkFaint(B, s, ev) {
    const c = B.sides[s].cur;
    if (!c || c.fainted || c.mon.hp > 0) return;
    c.mon.hp = 0; c.fainted = true; c.mon.st = null; c.mon.sl = 0;
    ev.push({ t: 'faint', s });
    if (s === 1 && B.kind !== 'link') awardExp(B, c.mon, ev);
    decideEnd(B, ev);
  }
  function giveExp(B, m, amt, ev) {
    m.exp += amt;
    while (m.lvl < 100 && m.exp >= expFor(m.lvl + 1)) {
      const oldMax = maxHp(m);
      m.lvl++;
      const nm = maxHp(m);
      if (m.hp > 0) m.hp = Math.min(nm, m.hp + (nm - oldMax));
      ev.push({ t: 'lvl', uid: m.uid, lvl: m.lvl, hp: m.hp });
      for (const [l, id] of SPECIES[m.sp].learn) {
        if (l !== m.lvl || m.moves.some((x) => x.id === id)) continue;
        if (m.moves.length < 4) { m.moves.push({ id, pp: MOVES[id].pp }); ev.push({ t: 'learned', uid: m.uid, mv: id }); }
        else ev.push({ t: 'learnAsk', uid: m.uid, mv: id });
      }
      const evo = SPECIES[m.sp].evo;
      if (evo && m.lvl >= evo[0]) m.evoReady = true;
    }
  }
  function awardExp(B, foe, ev) {
    const party = B.sides[0].party;
    const base = Math.max(1, Math.floor((SPECIES[foe.sp].xp * foe.lvl) / 7 * (B.kind === 'trainer' ? 1.5 : 1)));

  }

  /* ---------- rendering ---------- */
  function drawBottle(c, x, y, rot) {
    c.save(); c.translate(x, y); c.rotate(rot || 0);
    c.fillStyle = '#1c1428'; c.fillRect(-5, -7, 10, 14);
    c.fillStyle = '#8fd6c4'; c.fillRect(-4, -4, 8, 10); c.fillRect(-2, -7, 4, 4);
    c.fillStyle = '#c9955a'; c.fillRect(-2, -9, 4, 3);
    c.fillStyle = '#e4fbf4'; c.fillRect(-3, -3, 1, 6);
    c.restore();
  }
  function render(ctx, now) {
    const dt = Math.min(50, now - (S.last || now)); S.last = now;
    if (!S.bg) return;
    let sx = 0, sy = 0;
    if (S.shakeT > 0) { S.shakeT -= dt; sx = Math.round((Math.random() - 0.5) * 4); sy = Math.round((Math.random() - 0.5) * 3); }
    const so = S.slide || 0;
    const off = [Math.round(so * 240), -Math.round(so * 240)];
    ctx.drawImage(S.bg, sx, sy);
    for (const l of [1, 0]) {
      const p = S.plats[l];
      ctx.fillStyle = 'rgba(0,0,0,0.14)'; ctx.beginPath(); ctx.ellipse(p.sx + off[l] + sx, p.sy + sy, p.rx, p.ry * 0.8, 0, 0, TAU); ctx.fill();
      ctx.drawImage(p.cv, p.x + off[l] + sx, p.y + sy);
    }
    for (const l of [1, 0]) {
      const sp = S.spr[l];
      if (!sp || !sp.visible || sp.scale <= 0.01) continue;
      const b = POS[l];
      const w = 64 * sp.scale, h = 64 * sp.scale;
      const x = Math.round(b.x + 32 - w / 2 + sp.ox + sx + off[l]), y = Math.round(b.y + 64 - h + sp.oy + sy);
      ctx.save();
      ctx.globalAlpha = sp.alpha;
      if (sp.oy > 0) { ctx.beginPath(); ctx.rect(x - 20, 0, w + 40, b.y + 66 + sy); ctx.clip(); }
      const img = sp.flash ? whiteOf(sp.cv) : sp.cv;
      if (l === 0) { ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, w, h); }
      else ctx.drawImage(img, x, y, w, h);
      ctx.restore();
    }
    if (S.trainer && S.trainer.visible) ctx.drawImage(S.trainer.cv, Math.round(S.trainer.x + off[1]), Math.round(S.trainer.y));
    if (S.hero && S.hero.visible) ctx.drawImage(S.hero.cv, Math.round(S.hero.x + off[0]), Math.round(S.hero.y));
    if (S.bottle && S.bottle.visible) drawBottle(ctx, S.bottle.x, S.bottle.y, S.bottle.rot);
    for (let i = S.parts.length - 1; i >= 0; i--) {
      const p = S.parts[i];
      p.life -= dt;
      if (p.life <= 0) { S.parts.splice(i, 1); continue; }
      p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.vy += (p.g || 0) * dt / 16;
      ctx.globalAlpha = Math.min(1, p.life / 200);
      ctx.fillStyle = p.c;
      if (p.kind === 'star') { ctx.fillRect(p.x - 2, p.y, 5, 1); ctx.fillRect(p.x, p.y - 2, 1, 5); }
      else if (p.kind === 'ring') { ctx.strokeStyle = p.c; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, (1 - p.life / p.max) * p.r, 0, TAU); ctx.stroke(); }
      else ctx.fillRect(Math.round(p.x - p.size / 2), Math.round(p.y - p.size / 2), p.size, p.size);
      ctx.globalAlpha = 1;
    }
  }
  function centerOf(l) { return { x: POS[l].x + 32, y: POS[l].y + 38 }; }
  function burst(x, y, c, n, opts) {
    opts = opts || {};
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = (opts.speed || 1.6) * (0.4 + Math.random());
      S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opts.up || 0), g: opts.g || 0, life: opts.life || 420, max: opts.life || 420, c: Array.isArray(c) ? pick(c) : c, size: opts.size || 2, kind: opts.kind });
    }
  }
  function sparkle(l) {
    const c = centerOf(l);
    for (let i = 0; i < 10; i++) S.parts.push({ x: c.x + (Math.random() - 0.5) * 50, y: c.y + (Math.random() - 0.5) * 46, vx: 0, vy: -0.15, life: 500 + Math.random() * 500, max: 900, c: pick(['#ffffff', '#ffe14a', '#a6f0ff']), size: 2, kind: 'star' });
    Sound.play('shiny');
  }

  /* ---------- info boxes ---------- */
  function makeBoxes() {
    const hud = document.getElementById('hud');
    hud.innerHTML = '';
    const mk = (cls) => {
      const el = document.createElement('div'); el.className = 'bbox ' + cls;
      el.innerHTML = '<div class="bb-top">' + (cls === 'foe' ? '<span class="bb-own" hidden title="Already in your Logbook"><svg viewBox="0 0 7 10" shape-rendering="crispEdges"><rect x="2" y="0" width="3" height="2" fill="#a0683a"/><rect x="2" y="2" width="3" height="1" fill="#3c4048"/><rect x="1" y="3" width="5" height="7" fill="#3c4048"/><rect x="2" y="3" width="3" height="6" fill="#7fd0c0"/><rect x="2" y="4" width="1" height="3" fill="#e8fff8"/><rect x="2" y="7" width="3" height="2" fill="#3e9a8c"/></svg></span>' : '') +
        '<span class="bb-name"></span><span class="bb-st"></span><span class="bb-lv"></span></div>' +
        '<div class="bb-hp"><span class="bb-hplab">HP</span><div class="bar"><i></i></div></div>' +
        (cls === 'me' ? '<div class="bb-num"></div><div class="xbar"><i></i></div>' : '');
      hud.appendChild(el); el.hidden = true; return el;
    };
    S.boxes = [mk('me'), mk('foe')];
  }
  function setBox(l, mon) {
    const el = S.boxes[l]; if (!el) return;
    if (!mon) { el.hidden = true; return; }
    el.hidden = false;
    el.querySelector('.bb-name').textContent = monName(mon) + (mon.shiny ? ' ★' : '');
    el.querySelector('.bb-lv').textContent = 'Lv' + mon.lvl;
    setStatus(l, mon);
    S.hpShown[l] = mon.hp;
    drawHp(l, mon.hp, maxHp(mon));
    if (l === 0) drawExp(mon, false);
    else { const own = el.querySelector('.bb-own'); own.hidden = !(S.B.kind === 'wild' && G.save.dex.caught[mon.sp]); }
  }
  function setStatus(l, mon) {
    const st = S.boxes[l].querySelector('.bb-st');
    if (mon && mon.st) { st.textContent = STATUS_INFO[mon.st].n; st.style.background = STATUS_INFO[mon.st].c; st.hidden = false; }
    else st.hidden = true;
  }
  function drawHp(l, hp, max) {
    const el = S.boxes[l];
    const f = clamp(hp / max, 0, 1);
    const bar = el.querySelector('.bar i');
    bar.style.width = (f * 100).toFixed(1) + '%';
    bar.style.background = f > 0.5 ? '#3fbf5a' : f > 0.2 ? '#e8c22f' : '#e04a3a';
    if (l === 0) el.querySelector('.bb-num').textContent = Math.max(0, Math.round(hp)) + ' / ' + max;
  }
  function drawExp(mon, animate) {
    const el = S.boxes[0]; if (!el) return Promise.resolve();
    const lo = expFor(mon.lvl), hi = expFor(mon.lvl + 1);
    const f = mon.lvl >= 100 ? 1 : clamp((mon.exp - lo) / (hi - lo), 0, 1);
    const bar = el.querySelector('.xbar i');
    if (!animate) { bar.style.width = (f * 100) + '%'; return Promise.resolve(); }
    const from = parseFloat(bar.style.width) || 0;
    return tween(400, (t) => { bar.style.width = lerp(from, f * 100, t) + '%'; });
  }
  async function hpTo(l, hp, max) {
    const from = S.hpShown[l];
    const ms = 160 + Math.min(700, (Math.abs(from - hp) / max) * 900);
    await tween(ms, (t) => drawHp(l, lerp(from, hp, t), max));
    S.hpShown[l] = hp;
  }

  /* ---------- sprite animation helpers ---------- */
  function mkSpr(mon) { return { mon, cv: MonArt.get(mon.sp, mon.shiny), ox: 0, oy: 0, scale: 1, alpha: 1, flash: false, visible: true }; }
  async function heroThrow(target) {
    const h = S.hero;
    if (!h || !h.visible) return false;
    h.cv = WorldArt.portraitBack(h.look, 1); await wait(110);
    h.cv = WorldArt.portraitBack(h.look, 2);
    const sx = h.x + 46, sy = h.y + 14;
    S.bottle = { x: sx, y: sy, rot: 0, visible: true };
    Sound.play('throw');
    const fromX = h.x;
    await tween(360, (t) => {
      S.bottle.x = lerp(sx, target.x, t); S.bottle.y = lerp(sy, target.y + 10, t) - Math.sin(t * Math.PI) * 26; S.bottle.rot = t * 7;
      h.x = fromX - ease.in(t) * 90;
    });
    S.bottle.visible = false; h.visible = false; h.x = fromX;
    return true;
  }
  async function popIn(l, mon) {
    const sp = mkSpr(mon); sp.scale = 0; S.spr[l] = sp;
    const c = centerOf(l);
    if (l === 0 && !(await heroThrow(c))) {
      S.bottle = { x: -10, y: 100, rot: 0, visible: true };
      Sound.play('throw');
      await tween(300, (t) => { S.bottle.x = lerp(-10, c.x, t); S.bottle.y = lerp(100, c.y + 10, t) - Math.sin(t * Math.PI) * 30; S.bottle.rot = t * 6; });
      S.bottle.visible = false;
    }
    burst(c.x, c.y + 8, ['#ffffff', '#e2f5ff', '#bfe6ff'], 14, { speed: 2 });
    S.parts.push({ x: c.x, y: c.y + 6, vx: 0, vy: 0, life: 260, max: 260, c: '#ffffff', r: 24, kind: 'ring' });
    Sound.play('door');
    sp.flash = true;
    await tween(240, (t) => { sp.scale = t; }, ease.back);
    sp.scale = 1; sp.flash = false;
    Sound.cry(mon.sp);
    if (mon.shiny) { sparkle(l); await wait(450); }
  }
  async function withdraw(l) {
    const sp = S.spr[l]; if (!sp) return;
    sp.flash = true;
    await tween(220, (t) => { sp.scale = 1 - t; });
    sp.visible = false; sp.flash = false;
  }
  async function faintAnim(l) {
    const sp = S.spr[l]; if (!sp) return;
    Sound.cry(sp.mon.sp, true);
    await wait(250);
    Sound.play('faint');
    await tween(380, (t) => { sp.oy = t * 70; }, ease.in);
    sp.visible = false; sp.oy = 0;
  }
  async function hitFlash(l, eff) {
    const sp = S.spr[l]; if (!sp) return;
    Sound.play(eff > 1 ? 'hitSuper' : eff < 1 ? 'hitWeak' : 'hit');
    if (eff > 1) S.shakeT = 260;
    for (let i = 0; i < 3; i++) { sp.alpha = 0.15; await wait(55); sp.alpha = 1; await wait(55); }
  }
  async function moveAnim(s, mvId) {
    const mv = MOVES[mvId];
    const la = loc(s), lt = 1 - la;
    const col = TYPE_INFO[mv.t].c;
    const a = centerOf(la), b = centerOf(lt);
    const sp = S.spr[la];
    const selfMove = mv.c === 'X' && !mv.inflict && !(mv.fx && mv.fx.some((f) => f.who === 'foe'));
    if (selfMove) {
      for (let i = 0; i < 3; i++) { burst(a.x, a.y, [col, '#ffffff'], 6, { speed: 1, up: 0.6, life: 520 }); await wait(90); }
      Sound.play('stat');
      return;
    }
    if (mv.c === 'P' && sp) {
      const dir = la === 0 ? 1 : -1;
      await tween(110, (t) => { sp.ox = dir * t * 16; sp.oy = -dir * t * 8; });
      burst(b.x, b.y, [col, '#ffffff', lighten(col, 0.4)], 12, { speed: 2.2 });
      S.parts.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 260, max: 260, c: '#ffffff', r: 22, kind: 'ring' });
      await tween(140, (t) => { sp.ox = dir * (1 - t) * 16; sp.oy = -dir * (1 - t) * 8; });
      sp.ox = 0; sp.oy = 0;
      return;
    }
    const n = 7;
    for (let i = 0; i < n; i++) {
      const delay = i * 40;
      setTimeout(() => {
        const life = 340;
        S.parts.push({ x: a.x, y: a.y, vx: ((b.x - a.x) / life) * 16 + (Math.random() - 0.5), vy: ((b.y - a.y) / life) * 16 + (Math.random() - 0.5), life, max: life, c: i % 2 ? col : lighten(col, 0.45), size: 3 });
      }, delay);
    }
    Sound.play('blip');
    await wait(n * 40 + 320);
    burst(b.x, b.y, [col, '#ffffff'], 12, { speed: 2 });
    S.parts.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 280, max: 280, c: lighten(col, 0.3), r: 26, kind: 'ring' });
  }

  /* ---------- message helpers ---------- */
  const say = (t) => UI.say(t);
  const STAT_UP = ['', 'rose!', 'rose sharply!', 'rose drastically!'];
  const STAT_DN = ['', 'fell!', 'harshly fell!', 'severely fell!'];
  const ST_MSG = { brn: 'was burned!', psn: 'was poisoned!', shk: 'is shocked! It may be unable to move!', slp: 'fell asleep!' };
  const BROKE = ['Oh no! It popped right out!', 'Almost! It slipped out!', 'So close! It wriggled free!', 'Argh! It was nearly caught!'];

  async function learnPrompt(mon, mv) {
    const name = monName(mon), mn = MOVES[mv].n;
    for (;;) {
      const r = await UI.ask(`${name} wants to learn ${mn}, but it already knows four moves. Forget one to make room?`, ['Yes', 'No']);
      if (r === 0) {
        const i = await Screens.forgetMove(mon, mv);
        if (i >= 0) {
          const old = MOVES[mon.moves[i].id].n;
          mon.moves[i] = { id: mv, pp: MOVES[mv].pp };
          await say(`${name} forgot ${old}... and learned ${mn}!`);
          return;
        }
      }
      const r2 = await UI.ask(`Give up on learning ${mn}?`, ['Yes', 'No']);
      if (r2 === 0) { await say(`${name} did not learn ${mn}.`); return; }
    }
  }

  async function play(events) {
    const B = S.B;
    for (const e of events) {
      switch (e.t) {
        case 'in': {
          const l = loc(e.s), mon = B.sides[e.s].party[e.i];
          if (l === 0) {
            await UI.note(`Go! ${monName(mon)}!`);
            await popIn(0, mon); setBox(0, mon);
          } else {
            if (B.kind !== 'wild' || S.introDone) {
              const who = B.kind === 'link' ? B.sides[e.s].name : trainerTitle();
              await UI.note(`${who} sent out ${monName(mon)}!`);
              await popIn(1, mon); setBox(1, mon); markSeen(mon.sp);
              await wait(250);
            }
          }
          break;
        }
        case 'out': {
          const l = loc(e.s), mon = curMon(e.s);
          await UI.note(l === 0 ? `${monName(mon)}, come back!` : `${B.kind === 'link' ? B.sides[e.s].name : trainerTitle()} withdrew ${monName(mon)}!`);
          await withdraw(l); setBox(l, null); await wait(200);
          break;
        }
        case 'use': await UI.note(`${nm(e.s, true)} used ${MOVES[e.mv].n}!`); await moveAnim(e.s, e.mv); break;
        case 'miss': await say(`${nm(e.s, true)}'s attack missed!`); break;
        case 'hit': {
          const l = loc(e.s), mon = curMon(e.s);
          await hitFlash(l, e.eff);
          await hpTo(l, e.hp, maxHp(mon));
          break;
        }
        case 'crit': await say('A critical hit!'); break;
        case 'eff': await say(e.v > 1 ? 'It\'s super effective!' : 'It\'s not very effective...'); break;
        case 'hits': await say(`It hit ${e.n} time${e.n > 1 ? 's' : ''}!`); break;
        case 'status': setStatus(loc(e.s), curMon(e.s)); Sound.play('statdown'); await say(`${nm(e.s, true)} ${ST_MSG[e.st]}`); break;
        case 'immune': await say(`It doesn't affect ${nm(e.s, false)}...`); break;
        case 'fail': await say('But it failed!'); break;
        case 'stat': {
          const up = e.n > 0, k = Math.min(3, Math.abs(e.n));
          Sound.play(up ? 'stat' : 'statdown');
          const c = centerOf(loc(e.s));
          for (let i = 0; i < 8; i++) S.parts.push({ x: c.x + (Math.random() - 0.5) * 40, y: c.y + (up ? 20 : -20), vx: 0, vy: up ? -1.2 : 1.2, life: 450, max: 450, c: up ? '#ff9a5a' : '#6aa6ff', size: 2 });
          await say(`${nm(e.s, true)}'s ${STAT_NAMES[e.stat]} ${up ? STAT_UP[k] : STAT_DN[k]}`);
          break;
        }
        case 'statMax': await say(`${nm(e.s, true)}'s ${STAT_NAMES[e.stat]} won't go any ${e.up ? 'higher' : 'lower'}!`); break;
        case 'heal': Sound.play('heal'); await hpTo(loc(e.s), e.hp, maxHp(curMon(e.s))); await say(`${nm(e.s, true)} regained health!`); break;
        case 'nap': Sound.play('heal'); await hpTo(loc(e.s), e.hp, maxHp(curMon(e.s))); setStatus(loc(e.s), curMon(e.s)); await say(`${nm(e.s, true)} curled up in a hammock and fell asleep!`); break;
        case 'recoil': await hpTo(loc(e.s), e.hp, maxHp(curMon(e.s))); await say(`${nm(e.s, true)} was hurt by the recoil!`); break;
        case 'resid': {
          const l = loc(e.s);
          burst(centerOf(l).x, centerOf(l).y, STATUS_INFO[e.st].c, 10, { speed: 1 });
          await hpTo(l, e.hp, maxHp(curMon(e.s)));
          await say(`${nm(e.s, true)} is hurt by its ${e.st === 'brn' ? 'burn' : 'poison'}!`);
          break;
        }
        case 'sleep': await say(`${nm(e.s, true)} is fast asleep.`); break;
        case 'wake': setStatus(loc(e.s), curMon(e.s)); await say(`${nm(e.s, true)} woke up!`); break;
        case 'shocked': await say(`${nm(e.s, true)} is shocked! It can't move!`); break;
        case 'flinch': await say(`${nm(e.s, true)} flinched and couldn't move!`); break;
        case 'nopp': await say(`${nm(e.s, true)} has no moves left!`); break;
        case 'faint': {
          const l = loc(e.s);
          await faintAnim(l);
          await say(`${nm(e.s, true)} fainted!`);
          setBox(l, null);
          break;
        }
        case 'exp': {
          const m = findMon(e.uid); if (!m) break;
          await say(`${monName(m)} gained ${e.amt} EXP. Points!`);
          if (S.spr[0] && S.spr[0].mon === m) await drawExp(m, true);
          break;
        }
        case 'expShare': await say(`The rest of your crew gained ${e.amt} EXP. Points!`); break;
        case 'lvl': {
          const m = findMon(e.uid); if (!m) break;
          Sound.play('levelup');
          if (S.spr[0] && S.spr[0].mon === m) { setBox(0, m); }
          await say(`${monName(m)} grew to Lv. ${e.lvl}!`);
          break;
        }
        case 'learned': { const m = findMon(e.uid); if (m) { Sound.play('item'); await say(`${monName(m)} learned ${MOVES[e.mv].n}!`); } break; }
        case 'learnAsk': { const m = findMon(e.uid); if (m) await learnPrompt(m, e.mv); break; }
        case 'run': if (e.ok) Sound.play('run'); await say(e.ok ? 'Got away safely!' : 'Couldn\'t get away!'); break;
        case 'throw': {
          await UI.note(`{p} threw a ${ITEMS[e.item].n}!`);
          const c = centerOf(1);
          S.bottle = { x: 40, y: 110, rot: 0, visible: true };
          Sound.play('throw');
          await tween(420, (t) => { S.bottle.x = lerp(40, c.x, t); S.bottle.y = lerp(110, c.y - 6, t) - Math.sin(t * Math.PI) * 44; S.bottle.rot = t * 9; });
          const sp = S.spr[1];
          if (sp) { sp.flash = true; burst(c.x, c.y, ['#ffffff', '#bfe6ff'], 14, { speed: 2 }); await tween(220, (t) => { sp.scale = 1 - t; }); sp.visible = false; sp.flash = false; }
          await tween(260, (t) => { S.bottle.y = lerp(c.y - 6, c.y + 26, t); S.bottle.rot = 0; }, ease.in);
          break;
        }
        case 'shake': {
          for (let i = 0; i < e.n; i++) {
            await wait(380); Sound.play('shake');
            await tween(260, (t) => { S.bottle.rot = Math.sin(t * Math.PI * 2) * 0.5; });
            S.bottle.rot = 0;
          }
          await wait(400);
          break;
        }
        case 'caught': {
          const c = centerOf(1);
          for (let i = 0; i < 3; i++) S.parts.push({ x: c.x + (i - 1) * 10, y: c.y + 20, vx: (i - 1) * 0.6, vy: -1.4, g: 0.05, life: 700, max: 700, c: '#ffe14a', kind: 'star' });
          Sound.play('caught');
          await say(`Gotcha! ${monName(curMon(1))} was caught!`);
          break;
        }
        case 'broke': {
          const sp = S.spr[1];
          S.bottle.visible = false;
          if (sp) { sp.visible = true; sp.flash = true; burst(centerOf(1).x, centerOf(1).y + 10, '#ffffff', 10); await tween(200, (t) => { sp.scale = t; }); sp.flash = false; sp.scale = 1; }
          await say(BROKE[clamp(e.n, 0, 3)]);
          break;
        }
        case 'useItem': {
          const m = (B.sides[S.my].party || []).find((x) => x.uid === e.uid);
          const cur = curMon(S.my) === m;
          await say(`{p} used a ${ITEMS[e.item].n}${cur || !m ? '' : ' on ' + monName(m)}!`);
          break;
        }
        case 'itemHeal': {
          const m = findMon(e.uid);
          Sound.play('heal');
          if (m && curMon(S.my) === m) await hpTo(0, e.hp, maxHp(m));
          if (m) await say(`${monName(m)}'s HP was restored.`);
          break;
        }

function renderWorld(ctx) {
  const m = G.map; if (!m) return;
  const cx = G.cam.x, cy = G.cam.y;
  ctx.fillStyle = m.theme === 'outdoor' ? WPAL.sea : '#120c0c';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.drawImage(G.base, -cx, -cy);
  // animated water, shore foam and swaying flowers
  const t = G.time;
  const wf = Math.floor(t / 420) % 3, ff = Math.floor(t / 600) % 2, fo = Math.floor(t / 650) % 2;
  const x0 = Math.floor(cx / TS) - 1, y0 = Math.floor(cy / TS) - 1;
  const x1 = Math.floor((cx + VIEW_W) / TS) + 1, y1 = Math.floor((cy + VIEW_H) / TS) + 1;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const inMap = x >= 0 && y >= 0 && x < m.W && y < m.H;
      const mask = inMap ? G.wmask[y * m.W + x] : (m.theme === 'outdoor' ? 1 : 0);
      const ox = x * TS - cx, oy = y * TS - cy;
      if (mask) {
        if (wf || !inMap) WorldArt.water(ctx, ox, oy, mask & 32 ? 'pool' : mask & 64 ? 'cave' : 'sea', wf);
        if ((mask & 30) && !(mask & 64)) WorldArt.foam(ctx, ox, oy, mask, fo);
      } else if (ff && inMap && m.theme === 'outdoor' && m.rows[y][x] === 'F') WorldArt.flowers(ctx, ox, oy, 1);
    }
  }
  if (G.shadow) drawShadow(ctx, cx, cy);
  for (const it of G.items) drawItemObj(ctx, it.x * TS - cx, it.y * TS - cy, 'item');
  for (const ob of G.objects) if (!ob.show || ob.show()) drawItemObj(ctx, ob.x * TS - cx, ob.y * TS - cy, ob.kind, ob.sp);
  const ents = G.npcs.map((n) => ({ e: n, look: n.look })).concat(G.mode === 'world' || G.mode === 'cut' ? [{ e: G.player, look: 'hero', me: 1 }] : []);
  ents.sort((a, b) => a.e.py - b.e.py);
  for (const { e, look } of ents) {
    drawEnt(ctx, e, look, cx, cy);
    if (m.theme === 'outdoor' && !e.jump) {
      const [tx, ty] = entTile(e);
      const ch = tileAt(tx, ty);
      if (ch === ',') WorldArt.tallTop(ctx, tx * TS - cx, ty * TS - cy);
      else if (ch === ';') WorldArt.duneTop(ctx, tx * TS - cx, ty * TS - cy);
    }
  }
  if (G.rustle) {
    const k = (G.time - G.rustle.t) / 300;
    if (k >= 1 || G.rustle.t > G.time) G.rustle = null;
    else {
      const bx = G.rustle.x * TS - cx + 8, by = G.rustle.y * TS - cy + 9;
      for (const [dx, dy, col] of [[-1, -1, WPAL.tallDD], [1, -1.2, WPAL.tall], [-1.4, 0.1, WPAL.tall], [1.3, 0.2, WPAL.tallDD]]) {
        ctx.fillStyle = col;
        ctx.fillRect(Math.round(bx + dx * (3 + k * 7)), Math.round(by + dy * (2 + k * 5) - k * 4), 2, 2);
      }
    }
  }
  ctx.drawImage(G.top, -cx, -cy);
  ambient(ctx, cx, cy);
  if (G.emote) {
    const e = G.emote.ent, x = Math.round(e.px - cx) + 3, y = Math.round(e.py - cy) - 22;
    ctx.fillStyle = '#1c1428'; ctx.fillRect(x - 1, y - 1, 12, 12);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, 10, 10);
    ctx.fillStyle = '#c0443a'; ctx.fillRect(x + 4, y + 2, 2, 4); ctx.fillRect(x + 4, y + 7, 2, 2);
  }
  if (G.flashSky) { ctx.fillStyle = `rgba(255,255,255,${G.flashSky})`; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
}
function drawShadow(ctx, cx, cy) {
  const s = G.shadow;
  ctx.save();
  ctx.globalAlpha = s.alpha;
  ctx.fillStyle = '#0a1830';
  for (let i = 0; i < 14; i++) {
    const k = i / 13;
    const x = s.x - k * 150 * s.dir - cx, y = s.y + Math.sin(k * 5 + s.ph) * 18 - cy;
    const r = 14 - Math.abs(k - 0.25) * 12;
    ctx.beginPath(); ctx.ellipse(x, y, r * 1.6, Math.max(3, r), 0, 0, TAU); ctx.fill();
  }
  if (s.eyes) {
    ctx.globalAlpha = s.eyes;
    ctx.fillStyle = '#b8fbff';
    const ex = s.x - cx + 10 * s.dir, ey = s.y - cy - 3;
    ctx.fillRect(ex - 6, ey, 4, 2); ctx.fillRect(ex + 3, ey, 4, 2);
  }
  ctx.restore();
}

function spawnTemp(id, look, x, y, dir) {
  const n = { id, look, x, y, px: x * TS, py: y * TS, dir: dir || 'down', moving: false, frame: 0, temp: true };
  G.npcs.push(n);
  return n;
}

function moneyNode() { return h('div', 'm-money', `${G.save.money.toLocaleString('en-US')} doubloons`); }
function itemUsable(it, m) {
  if (it.kind === 'heal') return m.hp > 0 && m.hp < maxHp(m);
  if (it.kind === 'cure') return m.hp > 0 && !!m.st;

/* simple closable panel with its own key handling. returns a promise resolved on close */
function modalPanel(cls, build, keys) {
  return new Promise((resolve) => {
    const el = UI.panel(cls);
    let pop = null;
    const close = (v) => { if (pop) pop(); el.remove(); resolve(v); };
    const x = h('button', 'p-close', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'Close');
    x.addEventListener('click', () => { Sound.play('back'); close(); });
    const rebuild = () => { el.innerHTML = ''; build(el, close); el.appendChild(x); };
    rebuild();
    pop = Input.push((k) => {
      if (keys && keys(k, rebuild, close)) return;
      if (k === 'a' || k === 'b') { Sound.play('back'); close(); }
    });
  });
}

const Cloud = {
  db: null, uid: null, ready: false, busy: false, pending: null,
  async init() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
      if (!user || !db) return;
      const id = await user.id();
      if (!id) return;
      this.db = db; this.uid = id; this.ready = true;
    } catch (e) { this.ready = false; }
  },
  ref() { return this.db.doc('data/users/' + this.uid + '/save'); },
  async load() {
    if (!this.ready) return null;
    try {
      const s = await this.ref().get();
      if (!s.exists) return null;
      const d = s.data();
      return d && typeof d.json === 'string' ? JSON.parse(d.json) : null;
    } catch (e) { return null; }
  },
  async write(json, t) {
    if (!this.ready) return;

/* ============================================================

  },

  on(f) { this.listeners.add(f); return () => this.listeners.delete(f); },
  set(patch) {

  },
  refreshMe() {

  },
  others() {
    return this.peers.filter((p) => !p.isMe && p.kind === 'viewer' && p.presence && p.presence.g === GAME_TAG);
  },
  peer(id) { return this.peers.find((p) => p.peer === id) || null; },
  pname(p) { return (p && p.presence && cleanName(p.presence.n, 10)) || 'Trainer'; },
  badge() {

  /* ---------- encoding ---------- */
  teamCode() {

  },
  decodeTeam(arr) {

    const out = [];
    for (const t of arr.slice(0, 6)) {
      if (!t || !SPECIES[t.s] || SPECIES[t.s].legend) continue;
      const iv = (Array.isArray(t.i) ? t.i : []).slice(0, 5).map((v) => clamp(v | 0, 0, 31));
      while (iv.length < 5) iv.push(0);
      let moves = (Array.isArray(t.m) ? t.m : []).filter((id) => MOVES[id] && id !== 'thrash').slice(0, 4);
      if (!moves.length) moves = ['shove'];
      const mon = { uid: newId(), sp: t.s, lvl: 50, exp: expFor(50), iv, hp: 1, st: null, sl: 0, moves: moves.map((id) => ({ id, pp: MOVES[id].pp })), shiny: !!t.h, ot: '' };

  decodeMon(t) {

  /* ---------- lobby ---------- */

  lobby() {

  waitPanel(text, check) {

  async challenge(p, kind) {

  /* ---------- link battle ---------- */

  waitAction(m, step) {

        const row = h('div', 'tr-row');

        row.appendChild(card(theirMon, `${m.name} offers`));
        el.appendChild(row);
        const mine = myStr(), theirs = theirStr();
        const myOk = this.presence.ok && mine && theirs && this.presence.ok === pairHash(mine, theirs);
        const theirOk = q && q.presence.ok && mine && theirs && q.presence.ok === pairHash(theirs, mine);
        const st = h('div', 'lb-status', !q ? `${m.name} left the harbor.` : myOk && theirOk ? 'Trading...' : myOk ? `Waiting for ${m.name} to confirm...` : theirOk ? `${m.name} is ready to trade!` : 'Pick a Tideling to offer, then confirm.');
        el.appendChild(st);

          { act: 'pick', label: myIdx >= 0 ? 'Change my offer' : 'Choose my offer' },

          b.type = 'button';
