        el.appendChild(row);
        Sound.play('caught');
        el.appendChild(h('div', 'lb-status', `${monName(gave)} sailed off to ${m.name}. Take good care of ${monName(theirMon)}!`));
        const b = h('button', 'btn-ok', 'Done'); b.type = 'button'; el.appendChild(b);
        const fin = () => { pop(); off(); el.remove(); resolve(true); };
        b.addEventListener('click', fin);
        pop(); pop = Input.push((k) => { if (k === 'a' || k === 'b') fin(); });
      };
      const act = async () => {
        const e = entries[sel];
        if (!e || e.dis) { Sound.play('bump'); return; }
        Sound.play('ok');
        if (e.act === 'cancel') { this.set({ of: null, ok: null, s: 'idle' }); pop(); off(); el.remove(); resolve(false); return; }
        if (e.act === 'pick') {
          el.hidden = true;
          const i = await Screens.crew({ mode: 'item', title: 'Offer which Tideling?' });
          el.hidden = false;
          if (i >= 0) { myIdx = i; this.set({ of: this.encodeMon(G.save.party[i]), ok: null }); }
          build();
          return;
        }
        if (e.act === 'ok') {
          const mine = myStr(), theirs = theirStr();
          if (mine && theirs) this.set({ ok: pairHash(mine, theirs) });
          build();
        }
      };
      const off = this.on(build);
      let pop = Input.push((k) => {
        if (el.hidden || finished) return;
        if (k === 'up') { sel = (sel - 1 + entries.length) % entries.length; Sound.play('blip'); build(); }
        else if (k === 'down') { sel = (sel + 1) % entries.length; Sound.play('blip'); build(); }
        else if (k === 'a') act();
        else if (k === 'b') { sel = 2; act(); }
      });
      build();
    });
  },
};
SW.Online = Online;

/* ---- 15_main ---- */
/* ============================================================
   Saltwake — title screen, main loop, boot
   ============================================================ */
const Title = {
  best: null,
  async run() {
    G.mode = 'title';
    const card = document.getElementById('titleCard');
    card.hidden = false;
    this.best = loadLocal();
    Music.play('title');
    UI.fade(0, 700);
    if (!this.pressed) { await this.pressStart(); this.pressed = true; }
    await Promise.race([Title.cloudCheck, wait(600)]);
    for (;;) {
      const s = this.best;
      const items = [];
      if (s) {
        const caught = Object.keys((s.dex && s.dex.caught) || {}).length;
        items.push({ label: 'Continue', sub: `${s.name} · ${s.badges || 0} Pennant${s.badges === 1 ? '' : 's'} · Logbook ${caught}` });
      }
      items.push({ label: 'New Voyage' });
      const i = await UI.menu(items, { cls: 'm-titlemenu', cancel: false });
      Sound.init();
      if (s && i === 0) { card.hidden = true; await this.startFrom(s); return; }
      if (s) {
        const r = await UI.ask('Start a new voyage? Your old save stays until you save over it.', ['Start new', 'Back'], { noName: true });
        if (r !== 0) continue;
      }
      card.hidden = true;
      await UI.fade(1, 400);
      G.save = newSave('');
      UI.textSpeed = 2; Sound.on = true;
      G.sessionStart = performance.now();
      await Prologue.run();
      await introSequence();
      Online.refreshMe();
      return;
    }
  },
  /* "tap to start" like a handheld title screen; the first tap also unlocks sound */
  pressStart() {
    return new Promise((res) => {
      const el = document.getElementById('titlePress');
      el.hidden = false;
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        el.hidden = true; pop(); UI.screen.removeEventListener('pointerdown', onTap);
        Sound.init(); Music.play('title'); Sound.play('ok');
        res();
      };
      const onTap = (e) => { e.preventDefault(); finish(); };
      UI.screen.addEventListener('pointerdown', onTap);
      const pop = Input.push((k) => { if (k === 'a' || k === 'start') finish(); });
    });
  },
  async startFrom(s) {
    await UI.fade(1, 300);
    G.save = migrateSave(s);
    UI.textSpeed = G.save.opts.text || 2;
    Sound.on = G.save.opts.sound !== 0;
    Music.on = G.save.opts.music !== 0;
    G.sessionStart = performance.now();
    loadMap(G.save.pos.map);
    placePlayer(G.save.pos.x, G.save.pos.y, G.save.pos.dir);
    G.mode = 'world';
    G.lastArea = areaName() || G.map.name || '';
    await UI.fade(0, 300);
    if (G.lastArea) UI.banner(G.lastArea);
    Online.refreshMe();
  },
  render(ctx, now) {
    const t = now / 1000, HZ = 92;
    const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
    const sky = ['#1e1a4a', '#2a2156', '#3e2766', '#5c2d72', '#823a78', '#a84a78', '#cc6470', '#e68466', '#f4a564', '#f8c06c'];
    const bh = HZ / sky.length;
    sky.forEach((c, i) => R(0, Math.floor(i * bh), VIEW_W, Math.ceil(bh) + 1, c));
    for (let i = 0; i < 24; i++) { const x = (i * 53 + 7) % 240, y = (i * 29) % 42; if ((Math.floor(t * 2) + i) % 5) R(x, y, 1, 1, i % 3 ? '#ffffff' : '#ffe8b0'); }
    for (let dy = 0; dy < 23; dy++) { const w = Math.round(Math.sqrt(23 * 23 - dy * dy)); R(176 - w, HZ - 1 - dy, w * 2, 1, dy < 6 ? '#ffcf72' : dy < 14 ? '#ffda86' : '#ffe6a2'); }
    const sea = ['#3c4c8e', '#354482', '#2e3c74', '#283466', '#212c58', '#1b244a', '#151d3c'];
    const sh = (VIEW_H - HZ) / sea.length;
    sea.forEach((c, i) => R(0, HZ + Math.floor(i * sh), VIEW_W, Math.ceil(sh) + 1, c));
    for (let i = 0; i < 11; i++) {
      const y = HZ + 2 + i * 6, w = Math.round(30 - i * 2.3 + Math.sin(t * 2 + i) * 3);
      R(Math.round(176 - w / 2 + Math.sin(t + i) * 2), y, w, 1, i < 4 ? '#ffd890' : i < 8 ? '#e8b07a' : '#b8806a');
    }
    for (let i = 0; i < 16; i++) R(Math.round(((i * 41 + t * 12) % 260) - 10), HZ + 10 + (i % 6) * 10, 6, 1, '#5a6cb0');
    for (let x = -2; x < 122; x++) {
      const k = (x + 2) / 124, h = Math.max(0, Math.round(27 * Math.pow(Math.sin(Math.PI * k), 0.75) - (k > 0.55 ? (k - 0.55) * 18 : 0)));
      R(x, HZ - h, 1, h + 1, '#17132c');
    }
    R(41, HZ - 46, 8, 24, '#17132c'); R(39, HZ - 50, 12, 4, '#17132c'); R(43, HZ - 54, 4, 4, '#17132c'); R(42, HZ - 55, 6, 1, '#17132c');
    const ang = t * 1.4;
    ctx.save(); ctx.translate(45, HZ - 52); ctx.rotate(Math.sin(ang) * 0.9);
    ctx.fillStyle = 'rgba(255,240,180,0.32)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(130, -12); ctx.lineTo(130, 12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,0.22)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(130, -6); ctx.lineTo(130, 6); ctx.closePath(); ctx.fill();
    ctx.restore();
    R(43, HZ - 51, 4, 3, '#ffe48a');
    const sx = Math.round(((t * 6) % 300) - 40), by = HZ + 3;
    for (let i = 0; i < 5; i++) R(sx + i, by + i, 22 - i * 2, 1, '#17132c');
    R(sx + 10, by - 17, 2, 17, '#17132c');
    for (let i = 0; i < 14; i++) { R(sx + 12, by - 16 + i, Math.round(i * 0.6) + 1, 1, '#17132c'); }
    for (let i = 0; i < 11; i++) { R(sx + 9 - Math.round(i * 0.5), by - 13 + i, Math.round(i * 0.5) + 1, 1, '#17132c'); }
    for (let i = 0; i < 3; i++) {
      const gx = Math.round(((t * (14 + i * 4) + i * 80) % 280) - 20), gy = Math.round(28 + i * 12 + Math.sin(t * 2 + i) * 4);
      const f = Math.sin(t * 8 + i) > 0 ? 1 : 0;
      R(gx - 3, gy - f, 2, 1, '#1d1838'); R(gx - 1, gy, 1, 1, '#1d1838'); R(gx + 1, gy - f, 2, 1, '#1d1838');
    }
  },
};
Title.cloudCheck = Promise.resolve();

/* battle entry transitions drawn over whatever is on screen */
const Trans = {
  cur: null,
  run(kind) { return new Promise((res) => { this.cur = { kind, t0: performance.now(), dur: kind === 'bars' ? 620 : 760, res, done: false }; }); },
  clear() { this.cur = null; },
  draw(ctx, now) {
    const T = this.cur; if (!T) return;
    const p = Math.min(1, (now - T.t0) / T.dur);
    ctx.fillStyle = '#000';
    if (T.kind === 'bars') {
      for (let i = 0; i < 10; i++) {
        const q = clamp(p * 1.45 - i * 0.045, 0, 1), w = Math.ceil(q * VIEW_W);
        if (i % 2) ctx.fillRect(VIEW_W - w, i * 16, w, 16); else ctx.fillRect(0, i * 16, w, 16);
      }
    } else if (T.kind === 'spiral') {
      const a0 = -Math.PI / 2;
      for (const k of [0, Math.PI]) { ctx.beginPath(); ctx.moveTo(120, 80); ctx.arc(120, 80, 170, a0 + k, a0 + k + p * Math.PI); ctx.closePath(); ctx.fill(); }
    } else {
      const h = Math.ceil(p * 84);
      for (let x = 0; x < VIEW_W; x += 8) { const tooth = (x / 8) % 2 ? 6 : 0; ctx.fillRect(x, 0, 8, h + tooth); ctx.fillRect(x, VIEW_H - h - tooth, 8, h + tooth); }
    }
    if (p >= 1 && !T.done) { T.done = true; T.res(); }
  },
};
const Main = { ctx: null, last: 0 };
function frame(now) {
  const dt = Math.min(50, now - (Main.last || now));
  Main.last = now;
  const ctx = Main.ctx;
  try {
    if (G.mode === 'world') { updateWorld(dt); renderWorld(ctx); }
    else if (G.mode === 'battle') BattleUI.render(ctx, now);
    else if (G.mode === 'evo') BattleUI.renderEvo(ctx, now);
    else if (G.mode === 'intro') renderIntro(ctx, now);
    else if (G.mode === 'prologue') Prologue.render(ctx, now);
    else if (G.mode === 'title') Title.render(ctx, now);
    if (Trans.cur) Trans.draw(ctx, now);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
function boot(data) {
  UI.init();
  Input.init();
  Shell.init();
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  Main.ctx = ctx;
  requestAnimationFrame(frame);
  Title.cloudCheck = Cloud.init().then(async () => {
    const c = await Cloud.load();
    if (c && validSave(c) && (!Title.best || (c.saved || 0) > (Title.best.saved || 0))) Title.best = c;
  }).catch(() => {});
  Online.init();
  let restored = null;
  try { if (data && data.save) { const s = JSON.parse(data.save); if (validSave(s)) restored = s; } } catch (e) { restored = null; }
  if (restored) { document.getElementById('titleCard').hidden = true; Title.startFrom(restored); }
  else Title.run();
}
Object.assign(SW, { Trans, loadMap, placePlayer, warp, doBattle, makeMon, newSave, Title, SCRIPTS, MAPS, SPECIES, MOVES, ITEMS, TRAINERS, saveGame, loadLocal, healParty, flag, setFlag, Screens, onMapEnter });
(function start() {
  const hot = window.claude && window.claude.hot;
  try {
    if (hot && hot.snapshot) hot.snapshot(() => ({ save: G.save && G.save.flags && G.save.flags.intro_done && G.mode !== 'title' ? JSON.stringify(G.save) : null }));
  } catch (e) { /* not in a viewer */ }
  if (hot && hot.ready) hot.ready(boot);
  else boot((hot && hot.data) || {});
})();

})();
